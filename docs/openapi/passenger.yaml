openapi: 3.1.0
info:
  title: BML Passenger API
  version: "1.0.0"
  description: >
    Belize Marketplace & Logistics — the complete passenger transportation
    surface: the rider journey (discover services, browse departures, request
    and manage seat bookings), passenger-driver self-service (profile,
    vehicles, availability, eligibility), fleet-operator self-service (profile,
    fleet vehicles), the assigned driver's movement routes, the operator
    network surface (routes, stops, departures, staffing, booking answers),
    fleet affiliation on both sides (mutual consent), and the admin oversight
    and moderation surfaces. PASSENGER_DRIVER here is a DIFFERENT role and
    profile from DELIVERY_DRIVER (marketplace delivery + shipping courier
    legs), whose own profile/vehicle/service-area/availability surface is
    documented separately in driver.yaml beside this file — the similar
    field names (profile, vehicles, availability) describe two unrelated
    surfaces. All paths are under the `/api` prefix. Every
    endpoint was documented from its controller and its serializer read at
    `origin/main` (`passenger-rider.controller.ts`,
    `passenger-driver.controller.ts`, `passenger-provider.controller.ts`,
    `passenger-driver-trips.controller.ts`, `passenger-network.controller.ts`,
    `passenger-driver-affiliations.controller.ts`,
    `admin-passenger.controller.ts`, `admin-passenger-network.controller.ts`
    and the services they call) — nothing is described that was not read.

    THE FARE GATE, exactly as the code behaves (`fareGate()`,
    `passenger-operations.service.ts`): a booking can be neither created nor
    confirmed unless the departure's route carries an operator-configured fare.
    NULL IS NO FARE AND ZERO IS NOT A PRICE — `baseFareMinor <= 0` refuses with
    a plain-words 400 telling the rider to check back. No request on this
    surface carries a fare field anywhere: `baseFareMinor` is the operator's
    own configuration (set on their route, not documented here), it is REPORTED
    verbatim as a read-only JSON number (or null), and nothing computes,
    multiplies, quotes or charges with it — whether it is per seat or per
    booking is commercial policy nobody has set, and `fareQuotedMinor` on the
    booking row is deliberately never written and never serialized. An
    integrator cannot send 0 and expect a free ride: 0 keeps the gate closed.

    NO PASSENGER MONEY MOVES: no fare charged, no commission, no cancellation
    fee, no wallet movement of any kind on any endpoint here. The only money
    figure on the surface is the read-only `baseFareMinor` above. No live GPS
    tracking exists; `scheduleNote` is a label an operator typed, not a
    timetable. Production currently has no operator, route, departure or fare
    configured — the empty lists these endpoints answer are the system working.
servers:
  - url: https://bmplapi-production.up.railway.app/api
    description: Production
  - url: http://localhost:4000/api
    description: Local
tags:
  - name: Rider
    description: >-
      Any signed-in CUSTOMER; self-scoped, on the rider's own side of the
      simulation boundary. A departure outside the rider's visibility (other
      boundary side, inactive route, suspended operator, already departed)
      answers 404, indistinguishable from an id that never existed.
  - name: PassengerDriver
    description: >-
      Passenger-driver self-service. CUSTOMER-gated deliberately — an applicant
      builds their profile BEFORE the PASSENGER_DRIVER role is approved; going
      ONLINE is gated by computed eligibility in the service, not by the role
      guard.
  - name: PassengerProvider
    description: >-
      Fleet-operator (transport operator) self-service. CUSTOMER-gated for the
      same applicant reason; operational surfaces are gated downstream by role
      approval and vehicle moderation.
  - name: DriverTrips
    description: >-
      The assigned driver's movement surface — requires an APPROVED
      PASSENGER_DRIVER role. EN_ROUTE_TO_PICKUP is deliberately absent: that is
      the on-demand state, and on-demand is not built.
  - name: OperatorNetwork
    description: >-
      Operator self-service over their OWN routes and departures — requires an
      APPROVED PASSENGER_PROVIDER role (publishing a service is operational,
      unlike the CUSTOMER-gated application surface). Every query is scoped to
      the caller's own provider profile. Includes the operator's half of fleet
      affiliation and their booking answers (confirm/cancel) and staffing.
  - name: DriverAffiliations
    description: >-
      The driver's half of fleet affiliation — requires an APPROVED
      PASSENGER_DRIVER role. Mutual consent: the driver can ASK (request) and
      ANSWER an operator's ask (accept/decline); no endpoint can turn the
      driver's own request into an active affiliation — that consent is the
      operator's to give.
  - name: AdminPassengers
    description: >-
      Admin oversight and moderation. Reads sit behind the `passengers.read`
      permission, mutations behind `passengers.moderate` — the drivers.read /
      drivers.moderate split of the delivery side, mirrored. An admin-created
      route still BELONGS to the operator named in the request and inherits
      that operator's simulation-boundary side. There is deliberately NO admin
      affiliation mutation route — nobody consents on someone else's behalf.
security:
  - cookieAuth: []

paths:
  # ---- Rider ----
  /passenger/services:
    get:
      tags: [Rider]
      summary: What services run at all — discovery, deliberately no booking control
      description: >-
        The SAME PassengerRoute rows operators manage — not a second list that
        could drift (`listServices`, `passenger-operations.service.ts`). Scoped
        exactly as the departures list: the rider's boundary side, active
        routes, active operators. Each entry carries its ordered stops and its
        fare or an honest none — an unpriced service is deliberately SHOWN with
        `fareConfigured: false`; booking it still refuses at the fare gate.
        With nothing configured (production today) the list is honestly empty.
      responses:
        "200":
          description: Active services on the rider's boundary side (up to 100)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RiderService" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /passenger/departures:
    get:
      tags: [Rider]
      summary: Upcoming bookable departures
      description: >-
        SCHEDULED or ASSIGNED, future-dated, active route and operator, the
        rider's own boundary side, soonest first (up to 100)
        (`listDepartures`). Seats-remaining arithmetic needs a vehicle:
        `seatCapacity` is null until one is assigned — never an invented
        number.
      responses:
        "200":
          description: Bookable departures
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RiderDeparture" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /passenger/departures/{id}:
    get:
      tags: [Rider]
      summary: One departure — exactly the list entry plus the route's ordered stops
      description: >-
        The detail is the list row plus stops, nothing else differs
        (`getDeparture` shares the list's include and mapper so the two cannot
        drift). Stops come in the operator's stored sequence — never sorted,
        renumbered or re-derived from geography. Anything the list would not
        show answers 404, indistinguishable from a nonexistent id.
      parameters: [ { $ref: "#/components/parameters/tripId" } ]
      responses:
        "200":
          description: The departure with ordered stops
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderDepartureDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/bookings:
    post:
      tags: [Rider]
      summary: Request seats on a departure — a request holds NO seat
      description: >-
        Creates a REQUESTED booking after the fare gate (null is no fare, zero
        is not a price — 400 if the route is unpriced), a duplicate-booking
        check (one live booking per rider per departure), and the self-service
        invariant on user id — the person assigned to DRIVE the departure
        cannot ride it (`createBooking`). Seats are held at CONFIRMATION (by
        the operator), not at request. `isTest` is derived from the account,
        never the request. The response is the bare booking row: its
        trip-derived fields (`tripReference`, `routeName`, `from`, `to`,
        `scheduledDepartureAt`, `tripStatus`) are null here — read
        GET /passenger/bookings for the joined view.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId, seats]
              properties:
                tripId: { type: string }
                seats: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "201":
          description: The REQUESTED booking (bare row — see description)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderBooking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Rider]
      summary: The rider's own bookings, newest first (up to 100)
      responses:
        "200":
          description: Bookings with trip and route context joined
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RiderBooking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /passenger/bookings/{id}/cancel:
    post:
      tags: [Rider]
      summary: Cancel own booking
      description: >-
        Attributed `cancelledBy: PASSENGER` and audited. Once a departure has
        begun, bookings on it can no longer be cancelled — with one deliberate
        exception: a rider may ALWAYS withdraw their own unanswered REQUESTED
        booking, even after the departure left or completed, because it holds
        no seat and would otherwise sit in their list forever
        (`cancelOwnBooking` → the shared `cancelBooking`). A settled booking
        (already completed/cancelled) answers 400. Like create, the response is
        the bare row with trip-derived fields null.
      parameters: [ { $ref: "#/components/parameters/bookingId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The cancelled booking (bare row)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderBooking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Passenger-driver self-service ----
  /passenger/driver/profile:
    get:
      tags: [PassengerDriver]
      summary: Own passenger-driver profile, or JSON null if none exists yet
      responses:
        "200":
          description: The profile, or null — no profile is not an error for a would-be applicant
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PassengerDriverProfile"
                  - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [PassengerDriver]
      summary: Create or replace the profile (the application's substance)
      description: >-
        Open to any customer — an applicant builds this before approval;
        operations are gated separately on the role being APPROVED. `isTest` is
        never accepted: the simulation flag is admin-set only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerDriverProfileInput" }
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerDriverProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [PassengerDriver]
      summary: Update profile fields (any subset; an empty patch is refused)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [ { $ref: "#/components/schemas/PassengerDriverProfileInput" } ]
              description: All fields optional
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerDriverProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/driver/eligibility:
    get:
      tags: [PassengerDriver]
      summary: Whether this driver can go ONLINE — computed live, never stored
      description: >-
        Approved PASSENGER_DRIVER role + active profile + unexpired licence +
        at least one usable vehicle, where usable means approved, active,
        registration and insurance unexpired, and either the driver's own or —
        for an affiliated fleet driver — one of their operator's
        (`eligibility()`, `passenger-driver.service.ts`). Reasons come back in
        plain words.
      responses:
        "200":
          description: The verdict and every reason blocking it
          content:
            application/json:
              schema:
                type: object
                properties:
                  canGoOnline: { type: boolean }
                  reasons: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /passenger/driver/vehicles:
    get:
      tags: [PassengerDriver]
      summary: Own vehicles, primary first
      responses:
        "200":
          description: The driver's own vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PassengerVehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [PassengerDriver]
      summary: Register a vehicle — enters moderation as PENDING
      description: >-
        Sets the driver as the exactly-one owner; `isTest` is inherited from
        the owner's profile, never the request. The first vehicle becomes
        primary automatically. Admin approval is required before it can carry
        anyone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerVehicleInput" }
      responses:
        "201":
          description: The vehicle, approvalStatus PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerVehicle" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/driver/vehicles/{id}:
    patch:
      tags: [PassengerDriver]
      summary: Update own vehicle — editing regulated fields resets moderation to PENDING
      description: >-
        Changing licence plate, registration, insurance expiry or seat capacity
        sends the vehicle back to PENDING for re-review
        (`vehicleUpdateData`). A vehicle not owned by the caller answers 404.
      parameters: [ { $ref: "#/components/parameters/vehicleId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [ { $ref: "#/components/schemas/PassengerVehicleInput" } ]
              description: All fields optional; also accepts isActive (boolean)
      responses:
        "200":
          description: The updated vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerVehicle" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [PassengerDriver]
      summary: Delete own vehicle
      parameters: [ { $ref: "#/components/parameters/vehicleId" } ]
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/driver/availability:
    patch:
      tags: [PassengerDriver]
      summary: Go ONLINE / OFFLINE / UNAVAILABLE
      description: >-
        SUSPENDED is admin-only and not accepted here. Going ONLINE runs the
        eligibility check and refuses with every blocking reason in one
        message; going OFFLINE/UNAVAILABLE always succeeds
        (`setAvailability`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability: { type: string, enum: [OFFLINE, ONLINE, UNAVAILABLE] }
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerDriverProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Fleet-operator self-service ----
  /passenger/provider/profile:
    get:
      tags: [PassengerProvider]
      summary: Own operator profile, or JSON null if none exists yet
      responses:
        "200":
          description: The profile, or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PassengerProviderProfile"
                  - type: "null"
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [PassengerProvider]
      summary: Create or replace the operator profile
      description: "`isTest` is never accepted — admin-set only."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerProviderProfileInput" }
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerProviderProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [PassengerProvider]
      summary: Update operator profile fields (any subset; an empty patch is refused)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [ { $ref: "#/components/schemas/PassengerProviderProfileInput" } ]
              description: All fields optional
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerProviderProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/vehicles:
    get:
      tags: [PassengerProvider]
      summary: The fleet's vehicles, primary first
      responses:
        "200":
          description: Fleet vehicles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PassengerVehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [PassengerProvider]
      summary: Register a fleet vehicle — enters moderation as PENDING
      description: >-
        Sets the fleet as the exactly-one owner (never a driver); `isTest` is
        inherited from the fleet's profile. Unlike the driver path, a first
        fleet vehicle is NOT auto-primary.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PassengerVehicleInput" }
      responses:
        "201":
          description: The vehicle, approvalStatus PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerVehicle" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/vehicles/{id}:
    patch:
      tags: [PassengerProvider]
      summary: Update a fleet vehicle — regulated-field edits reset moderation to PENDING
      parameters: [ { $ref: "#/components/parameters/vehicleId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [ { $ref: "#/components/schemas/PassengerVehicleInput" } ]
              description: All fields optional; also accepts isActive (boolean)
      responses:
        "200":
          description: The updated vehicle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerVehicle" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [PassengerProvider]
      summary: Delete a fleet vehicle
      parameters: [ { $ref: "#/components/parameters/vehicleId" } ]
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Assigned driver movement ----
  /passenger/driver/trips:
    get:
      tags: [DriverTrips]
      summary: The driver's own ASSIGNED and IN_PROGRESS departures, soonest first
      responses:
        "200":
          description: Up to 100 trips
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverTrip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/driver/trips/{id}/start:
    post:
      tags: [DriverTrips]
      summary: Start an ASSIGNED departure
      description: >-
        Own assignment only — anything else answers 404. Only an ASSIGNED
        departure can start (`startTrip`).
      parameters: [ { $ref: "#/components/parameters/tripId" } ]
      responses:
        "201":
          description: The trip, now IN_PROGRESS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripTransitionResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/driver/trips/{id}/complete:
    post:
      tags: [DriverTrips]
      summary: Complete an IN_PROGRESS departure
      description: >-
        Completes the trip's CONFIRMED bookings with it and closes the staffing
        record in the same transaction, incrementing the driver's
        completed-trip count. REQUESTED bookings are deliberately left
        untouched — what an unanswered request becomes when the bus leaves is
        an open product question, not a default to invent (`completeTrip`).
      parameters: [ { $ref: "#/components/parameters/tripId" } ]
      responses:
        "201":
          description: The trip, now COMPLETED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripTransitionResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Operator network: routes and stops ----
  /passenger/provider/routes:
    get:
      tags: [OperatorNetwork]
      summary: The operator's own routes, newest first, with stops and trip counts
      responses:
        "200":
          description: Own routes (stops ordered, tripCount included)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperatorRoute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [OperatorNetwork]
      summary: Describe a service — an operator-entered fact about Belize
      description: >-
        Nothing is derived or defaulted from geography; the operator declares
        which towns their service connects, in what order. `baseFareMinor` is
        their commercial declaration (0 keeps the booking gate closed).
        `isTest` is never accepted — a route inherits the operator's
        boundary side. A suspended operator can create no new route.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteInput" }
      responses:
        "201":
          description: The created route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorRoute" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/routes/{id}:
    get:
      tags: [OperatorNetwork]
      summary: One of the operator's own routes
      parameters: [ { $ref: "#/components/parameters/routeId" } ]
      responses:
        "200":
          description: The route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorRoute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [OperatorNetwork]
      summary: Update a route — endpoints freeze once departures exist; the fare stays editable
      description: >-
        Moving the route's origin/destination is refused once ANY departure
        exists (cancelled ones included) — a trip row is history that
        reconstructs against the route's geography; create a new route
        instead. The fare is money configuration, not geography: it stays
        editable after departures exist (no charge has occurred; bookings
        snapshot nothing), and every change lands in the audit trail.
      parameters: [ { $ref: "#/components/parameters/routeId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [ { $ref: "#/components/schemas/RouteInput" } ]
              description: All fields optional (stops excluded — use the stops route); also accepts isActive
      responses:
        "200":
          description: The updated route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorRoute" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/routes/{id}/stops:
    put:
      tags: [OperatorNetwork]
      summary: Replace the route's ordered stops as a whole list
      description: >-
        Order comes from array position — a client never numbers stops itself.
        Refused once the route has ANY departures, cancelled ones included: a
        trip row means the route was operated as described, so the description
        stops being editable.
      parameters: [ { $ref: "#/components/parameters/routeId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 50
              items: { $ref: "#/components/schemas/RouteStopInput" }
      responses:
        "200":
          description: The route with its new stops
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorRoute" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Operator network: departures, staffing, booking answers ----
  /passenger/provider/trips:
    get:
      tags: [OperatorNetwork]
      summary: The operator's own departures, with seat arithmetic
      parameters:
        - { name: routeId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/TripStatus" } }
      responses:
        "200":
          description: Departures (seatsConfirmed / seatsRemaining included; only CONFIRMED bookings spend seats)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperatorTrip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [OperatorNetwork]
      summary: Publish a departure of one of the operator's own routes
      description: >-
        Every creatable trip is `kind: SCHEDULED` — the ON_DEMAND enum value
        has no writer. An inactive route, or a suspended operator, publishes
        nothing (reads, edits and cancellations keep working so a suspended
        operator can wind down). The reference (BML-T…) is unique across trips
        AND shipments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripCreateInput" }
      responses:
        "201":
          description: The published departure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorTrip" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/trips/{id}/cancel:
    post:
      tags: [OperatorNetwork]
      summary: Cancel a departure — SCHEDULED or ASSIGNED only
      description: >-
        Anything in progress is people on a vehicle, and that is not a
        cancellation. Riders on the departure are cancelled WITH it, attributed
        to the same party, and the staffing record is closed truthfully.
      parameters: [ { $ref: "#/components/parameters/tripId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The cancelled departure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorTrip" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/trips/{id}/assign:
    post:
      tags: [OperatorNetwork]
      summary: Staff a departure with a fleet driver and a vehicle — manual only, no reassignment path
      description: >-
        Assignment is manual by design (the delivery lesson — no automatic
        dispatch exists for passengers), and only an unstaffed SCHEDULED
        departure can be assigned; the absence of a reassignment path is
        itself a guarantee. Gates, each read in `assignTrip`
        (`passenger-operations.service.ts`): the driver must be active, on the
        trip's boundary side, hold an APPROVED PASSENGER_DRIVER role
        (re-checked live), belong to the operator's own fleet, and not hold a
        booking on the very departure they would drive (the self-service
        invariant, on user id); the vehicle must be approved, on the right
        boundary side, and either the fleet's or the assigned driver's own.
        Seat capacity is snapshotted from the vehicle HERE — it is what
        confirmations sell — and an audited staffing record is written.
      parameters: [ { $ref: "#/components/parameters/tripId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverProfileId, vehicleId]
              properties:
                driverProfileId: { type: string }
                vehicleId: { type: string }
      responses:
        "201":
          description: The staffing result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripAssignResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/bookings:
    get:
      tags: [OperatorNetwork]
      summary: Bookings on the operator's own departures, newest first (up to 300)
      parameters:
        - { name: tripId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/BookingStatus" } }
      responses:
        "200":
          description: Bookings with trip context and passenger name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffBooking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/bookings/{id}/confirm:
    post:
      tags: [OperatorNetwork]
      summary: Confirm a booking — the moment a seat is actually held; fails closed three ways
      description: >-
        Only a REQUESTED booking on a still-bookable departure confirms, and it
        fails closed three ways (`confirmBooking`): no configured fare (the
        fare gate holds at confirmation too — a fare unset since the request
        still refuses), no assigned vehicle (capacity unknowable — "assign a
        vehicle first"), or not enough seats left. The capacity sum runs under
        a row lock on the trip so concurrent confirmations serialize instead
        of overselling the last seat. The response is the bare booking row
        (trip-derived fields null).
      parameters: [ { $ref: "#/components/parameters/bookingId" } ]
      responses:
        "201":
          description: The CONFIRMED booking (bare row)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderBooking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/bookings/{id}/cancel:
    post:
      tags: [OperatorNetwork]
      summary: Cancel a booking on one of the operator's own departures
      description: >-
        Attributed `cancelledBy: PROVIDER`, audited, and the rider is notified.
        Refused once the departure has begun (only the rider's own REQUESTED
        withdrawal survives that rule). Bare-row response.
      parameters: [ { $ref: "#/components/parameters/bookingId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The cancelled booking (bare row)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderBooking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Fleet affiliation: the operator's half ----
  /passenger/provider/affiliations:
    get:
      tags: [OperatorNetwork]
      summary: The fleet's affiliations, newest first (up to 200), each with the driver's identity
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/AffiliationStatus" } }
      responses:
        "200":
          description: Affiliations with a driver identity block
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProviderAffiliation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/affiliations/invite:
    post:
      tags: [OperatorNetwork]
      summary: Invite a driver into the fleet — creates a PENDING ask, never an ACCEPTED row
      description: >-
        Mutual consent: the driver must accept. One live ask per pair in either
        direction is a database fact (a partial unique index refuses twin
        pending asks that race past the pre-check) — the second asker answers
        the existing ask with the proper verb instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverProfileId]
              properties:
                driverProfileId: { type: string }
                message: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The PENDING invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Affiliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/affiliations/{id}/approve:
    post:
      tags: [OperatorNetwork]
      summary: Approve a driver's join request — the operator's consent
      description: >-
        Answers a DRIVER-initiated ask only; no endpoint turns the operator's
        own invitation into an active affiliation. Acceptance is the single
        place in the whole API that sets the driver's fleet pointer, in the
        same transaction, conditionally — a driver can never land in two
        fleets.
      parameters: [ { $ref: "#/components/parameters/affiliationId" } ]
      responses:
        "201":
          description: The ACCEPTED affiliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Affiliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/affiliations/{id}/decline:
    post:
      tags: [OperatorNetwork]
      summary: Decline a driver's join request
      parameters: [ { $ref: "#/components/parameters/affiliationId" } ]
      responses:
        "201":
          description: The DECLINED affiliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Affiliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/affiliations/{id}/withdraw:
    post:
      tags: [OperatorNetwork]
      summary: Withdraw the operator's own pending invitation
      parameters: [ { $ref: "#/components/parameters/affiliationId" } ]
      responses:
        "201":
          description: The WITHDRAWN affiliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Affiliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/provider/affiliations/{id}/end:
    post:
      tags: [OperatorNetwork]
      summary: End an active affiliation — unilateral, either side may dissolve
      description: >-
        Consent creates the relationship; either side ends it alone. Departures
        already staffed stay staffed; only NEW staffing refuses afterwards.
      parameters: [ { $ref: "#/components/parameters/affiliationId" } ]
      responses:
        "201":
          description: The ENDED affiliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Affiliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Fleet affiliation: the driver's half ----
  /passenger/driver/affiliations:
    get:
      tags: [DriverAffiliations]
      summary: The driver's affiliations, newest first (up to 200), each with the operator's identity
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/AffiliationStatus" } }
      responses:
        "200":
          description: Affiliations with a provider identity block
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverAffiliation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/driver/affiliations/request:
    post:
      tags: [DriverAffiliations]
      summary: Ask to join a fleet — creates a PENDING ask the operator must approve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerProfileId]
              properties:
                providerProfileId: { type: string }
                message: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The PENDING request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Affiliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/driver/affiliations/{id}/accept:
    post:
      tags: [DriverAffiliations]
      summary: Accept an operator's invitation — the driver's consent
      description: >-
        Answers a PROVIDER-initiated ask only. Acceptance sets the driver's
        fleet pointer in the same transaction, conditionally — the single
        writer of that pointer in the whole API, so a driver can never land in
        two fleets.
      parameters: [ { $ref: "#/components/parameters/affiliationId" } ]
      responses:
        "201":
          description: The ACCEPTED affiliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Affiliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/driver/affiliations/{id}/decline:
    post:
      tags: [DriverAffiliations]
      summary: Decline an operator's invitation
      parameters: [ { $ref: "#/components/parameters/affiliationId" } ]
      responses:
        "201":
          description: The DECLINED affiliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Affiliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/driver/affiliations/{id}/withdraw:
    post:
      tags: [DriverAffiliations]
      summary: Withdraw the driver's own pending request
      parameters: [ { $ref: "#/components/parameters/affiliationId" } ]
      responses:
        "201":
          description: The WITHDRAWN affiliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Affiliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /passenger/driver/affiliations/{id}/end:
    post:
      tags: [DriverAffiliations]
      summary: Leave the fleet — unilateral, either side may dissolve
      parameters: [ { $ref: "#/components/parameters/affiliationId" } ]
      responses:
        "201":
          description: The ENDED affiliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Affiliation" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Admin: supply oversight and moderation ----
  /admin/passengers/drivers:
    get:
      tags: [AdminPassengers]
      summary: All passenger drivers with vetting posture (passengers.read)
      parameters:
        - { name: district, in: query, required: false, schema: { $ref: "#/components/schemas/District" } }
        - { name: availability, in: query, required: false, schema: { $ref: "#/components/schemas/Availability" } }
        - { name: roleStatus, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Driver rows (up to 300) with role status, vehicle counts and expired-docs flag
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminDriverRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/passengers/drivers/{id}:
    get:
      tags: [AdminPassengers]
      summary: One driver in full — profile, user, role status, fleet, vehicles (passengers.read)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Driver profile id }
      responses:
        "200":
          description: The full driver detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDriverDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/providers:
    get:
      tags: [AdminPassengers]
      summary: All transport operators with fleet posture (passengers.read)
      responses:
        "200":
          description: Operator rows (up to 300) with role status, vehicle and driver counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminProviderRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/passengers/drivers/{id}/test-mode:
    patch:
      tags: [AdminPassengers]
      summary: Flip a driver between real and simulation (passengers.moderate; audited)
      description: >-
        The simulation flag is admin-set ONLY, on every passenger model. The
        flip re-derives the driver's dependent rows and REFUSES while the
        account has open trips or an ACCEPTED affiliation — the guards run
        inside the flip transaction after a profile-row lock, so a flip cannot
        race a consent into a cross-boundary link (`setDriverTestMode`,
        `admin-passenger.service.ts`). A no-op flip returns without writing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Driver profile id }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestModeInput" }
      responses:
        "200":
          description: The new flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  displayName: { type: string }
                  isTest: { type: boolean }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/providers/{id}/test-mode:
    patch:
      tags: [AdminPassengers]
      summary: Flip an operator between real and simulation (passengers.moderate; audited)
      description: >-
        Same guards as the driver flip, plus: the flip re-derives every route
        and fleet vehicle the operator owns in the same transaction — every
        later departure inherits its side from the ROUTE. Open trips refuse the
        flip; CLOSED trips keep their flag deliberately, as a record of which
        side they actually ran on (`setProviderTestMode`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Provider profile id }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestModeInput" }
      responses:
        "200":
          description: The new flag
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  businessName: { type: string }
                  isTest: { type: boolean }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/vehicles/{id}/approve:
    post:
      tags: [AdminPassengers]
      summary: Approve a vehicle to carry passengers (passengers.moderate; audited)
      parameters: [ { $ref: "#/components/parameters/vehicleId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The vehicle, approvalStatus APPROVED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerVehicle" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/vehicles/{id}/reject:
    post:
      tags: [AdminPassengers]
      summary: Reject a vehicle (passengers.moderate; audited)
      parameters: [ { $ref: "#/components/parameters/vehicleId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The vehicle, approvalStatus REJECTED with the reason recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerVehicle" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- Admin: network oversight (acts across ALL operators) ----
  /admin/passengers/routes:
    get:
      tags: [AdminPassengers]
      summary: Every operator's routes (passengers.read; up to 300)
      parameters:
        - { name: isTest, in: query, required: false, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Routes with stops, provider identity and trip counts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperatorRoute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [AdminPassengers]
      summary: Create a route on an operator's behalf (passengers.moderate; audited)
      description: >-
        The request names the owning operator (`providerProfileId`) —
        everything else is identical to the operator's own schema. The route
        still BELONGS to that operator and inherits THEIR simulation-boundary
        side: admin authorship changes who typed it in, not whose service it
        is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [ { $ref: "#/components/schemas/RouteInput" } ]
              required: [providerProfileId]
              properties:
                providerProfileId: { type: string }
      responses:
        "201":
          description: The created route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorRoute" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/routes/{id}:
    get:
      tags: [AdminPassengers]
      summary: One route, any operator (passengers.read)
      parameters: [ { $ref: "#/components/parameters/routeId" } ]
      responses:
        "200":
          description: The route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorRoute" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [AdminPassengers]
      summary: Update any route (passengers.moderate; same freeze rules as the operator's own)
      parameters: [ { $ref: "#/components/parameters/routeId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf: [ { $ref: "#/components/schemas/RouteInput" } ]
              description: All fields optional (stops excluded); also accepts isActive
      responses:
        "200":
          description: The updated route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorRoute" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/routes/{id}/stops:
    put:
      tags: [AdminPassengers]
      summary: Replace any route's stops (passengers.moderate; same freeze rule)
      parameters: [ { $ref: "#/components/parameters/routeId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 50
              items: { $ref: "#/components/schemas/RouteStopInput" }
      responses:
        "200":
          description: The route with its new stops
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorRoute" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/trips:
    get:
      tags: [AdminPassengers]
      summary: Every operator's departures (passengers.read)
      parameters:
        - { name: routeId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/TripStatus" } }
      responses:
        "200":
          description: Departures with seat arithmetic
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperatorTrip" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [AdminPassengers]
      summary: Publish a departure on any route (passengers.moderate; same publish gates)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripCreateInput" }
      responses:
        "201":
          description: The published departure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorTrip" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/trips/{id}/cancel:
    post:
      tags: [AdminPassengers]
      summary: Cancel any departure (passengers.moderate; SCHEDULED/ASSIGNED only, riders cancelled with it)
      parameters: [ { $ref: "#/components/parameters/tripId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The cancelled departure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperatorTrip" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/trips/{id}/assignable-vehicles:
    get:
      tags: [AdminPassengers]
      summary: "The vehicles assign would accept for this departure (passengers.moderate)"
      description: >-
        The console's vehicle picker asks the authority instead of guessing
        (`PassengerOperationsService.assignableVehiclesForTrip`). Two kinds of
        row, exactly as assign accepts them: FLEET — the trip operator's own
        approved active vehicle, usable by any eligible fleet driver
        (`usableByDriverProfileId` null); DRIVER — an eligible fleet driver's
        own vehicle, which assign accepts ONLY paired with that driver
        (`usableByDriverProfileId` names them). "Eligible" mirrors the assign
        gates: this operator's fleet, active, same side of the test boundary,
        PASSENGER_DRIVER approved, and not holding a booking on this very
        departure. Nothing from an unrelated operator ever appears. Answers
        400 for a departure that can no longer be assigned (not SCHEDULED, or
        suspended operator), and — deliberately narrower than assign — for a
        departure whose operator row no longer exists, rather than enumerating
        unaffiliated drivers' vehicles platform-wide.
      parameters: [ { $ref: "#/components/parameters/tripId" } ]
      responses:
        "200":
          description: Vehicles the assign endpoint would accept, fleet first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssignableVehicle" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/trips/{id}/assign:
    post:
      tags: [AdminPassengers]
      summary: Staff any departure (passengers.moderate; identical gates to the operator's assign)
      parameters: [ { $ref: "#/components/parameters/tripId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverProfileId, vehicleId]
              properties:
                driverProfileId: { type: string }
                vehicleId: { type: string }
      responses:
        "201":
          description: The staffing result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripAssignResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/bookings:
    get:
      tags: [AdminPassengers]
      summary: Seat-level booking oversight across all operators (passengers.read)
      parameters:
        - { name: tripId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/BookingStatus" } }
      responses:
        "200":
          description: Bookings with trip context and passenger name (up to 300)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StaffBooking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/passengers/bookings/{id}/confirm:
    post:
      tags: [AdminPassengers]
      summary: Confirm any booking (passengers.moderate; same three fail-closed gates and row lock)
      parameters: [ { $ref: "#/components/parameters/bookingId" } ]
      responses:
        "201":
          description: The CONFIRMED booking (bare row)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderBooking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/passengers/bookings/{id}/cancel:
    post:
      tags: [AdminPassengers]
      summary: Cancel any booking (passengers.moderate; attributed ADMIN, rider notified)
      parameters: [ { $ref: "#/components/parameters/bookingId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The cancelled booking (bare row)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiderBooking" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
  parameters:
    tripId: { name: id, in: path, required: true, schema: { type: string }, description: Departure (trip) id }
    bookingId: { name: id, in: path, required: true, schema: { type: string }, description: Booking id }
    vehicleId: { name: id, in: path, required: true, schema: { type: string }, description: Vehicle id }
    routeId: { name: id, in: path, required: true, schema: { type: string }, description: Route id }
    affiliationId: { name: id, in: path, required: true, schema: { type: string }, description: Affiliation id }
  responses:
    ValidationError:
      description: Validation failed, or the operation is not legal in this state (plain-words message)
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: array
                items:
                  type: object
                  properties: { path: { type: string }, message: { type: string } }
    Unauthorized: { description: Authentication required }
    Forbidden: { description: Missing role (DriverTrips requires an APPROVED PASSENGER_DRIVER role) }
    NotFound: { description: Not found, not owned, or outside the caller's visibility (deliberately indistinguishable) }
  schemas:
    BaseFareMinor:
      type: [integer, "null"]
      description: >-
        The operator's configured fare in BZD minor units (cents), as a JSON
        NUMBER (converted from BigInt with Number() in
        passenger-operations.service.ts) or null when unset. READ-ONLY and
        REPORTED VERBATIM — nothing computes, multiplies or charges with it;
        whether it is per seat or per booking is undecided commercial policy.
        Null is no fare and zero is not a price: both keep the booking gate
        closed (`fareConfigured` is true only when the value is > 0). No
        request on this surface accepts a fare field.
    District:
      type: string
      enum: [BELIZE, CAYO, COROZAL, ORANGE_WALK, STANN_CREEK, TOLEDO]
    TripStatus:
      type: string
      enum: [SCHEDULED, PENDING_ASSIGNMENT, ASSIGNED, EN_ROUTE_TO_PICKUP, IN_PROGRESS, COMPLETED, CANCELLED, EXCEPTION]
      description: >-
        Reachable today: SCHEDULED, ASSIGNED, IN_PROGRESS, COMPLETED,
        CANCELLED. PENDING_ASSIGNMENT, EN_ROUTE_TO_PICKUP and EXCEPTION are
        reserved vocabulary with no writers — do not expect them.
    BookingStatus:
      type: string
      enum: [REQUESTED, CONFIRMED, COMPLETED, CANCELLED, NO_SHOW, EXPIRED]
      description: >-
        Reachable today: REQUESTED, CONFIRMED, COMPLETED, CANCELLED. NO_SHOW
        and EXPIRED exist in the enum but nothing sets them — who may declare a
        no-show, and when an unanswered request expires, are open product
        questions.
    CancellationParty:
      type: string
      enum: [PASSENGER, DRIVER, PROVIDER, ADMIN, SYSTEM]
    VehicleType:
      type: string
      enum: [CAR, SUV, VAN, MINIBUS, BUS, BOAT, MOTORCYCLE, OTHER]
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    Availability:
      type: string
      enum: [OFFLINE, ONLINE, UNAVAILABLE, SUSPENDED]
      description: SUSPENDED is admin-set; a driver may set only the other three
    ExpiryStatus:
      type: [string, "null"]
      enum: [VALID, EXPIRING_SOON, EXPIRED, null]
      description: Derived from the expiry date; null when no date is recorded

    RouteStop:
      type: object
      description: One stop, in the operator's stored order — never re-derived from geography
      properties:
        sequence: { type: integer }
        district: { $ref: "#/components/schemas/District" }
        city: { type: string }
        name: { type: [string, "null"] }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
    RiderService:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        originDistrict: { $ref: "#/components/schemas/District" }
        originCity: { type: string }
        destinationDistrict: { $ref: "#/components/schemas/District" }
        destinationCity: { type: string }
        scheduleNote: { type: [string, "null"], description: "A label the operator wrote, reported verbatim — not a calendar" }
        durationMinutes: { type: [integer, "null"] }
        stops:
          type: array
          items: { $ref: "#/components/schemas/RouteStop" }
        operator: { type: string, description: The operator's business name }
        baseFareMinor: { $ref: "#/components/schemas/BaseFareMinor" }
        fareConfigured: { type: boolean }
    RiderDeparture:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        status: { $ref: "#/components/schemas/TripStatus" }
        scheduledDepartureAt: { type: string, format: date-time }
        scheduledArrivalAt: { type: [string, "null"], format: date-time }
        route:
          type: object
          properties:
            name: { type: string }
            originDistrict: { $ref: "#/components/schemas/District" }
            originCity: { type: string }
            destinationDistrict: { $ref: "#/components/schemas/District" }
            destinationCity: { type: string }
            scheduleNote: { type: [string, "null"] }
            durationMinutes: { type: [integer, "null"] }
        operator: { type: [string, "null"] }
        baseFareMinor: { $ref: "#/components/schemas/BaseFareMinor" }
        fareConfigured: { type: boolean }
        seatCapacity: { type: [integer, "null"], description: "Null until a vehicle is assigned — capacity does not exist before a vehicle is snapshotted" }
        seatsConfirmed: { type: integer, description: Seats sold (CONFIRMED bookings) }
    RiderDepartureDetail:
      allOf:
        - $ref: "#/components/schemas/RiderDeparture"
      description: The list entry plus the route's ordered stops — nothing else differs
      properties:
        route:
          type: object
          properties:
            stops:
              type: array
              items: { $ref: "#/components/schemas/RouteStop" }
    RiderBooking:
      type: object
      description: >-
        A booking carries NO fare field of any kind — `fareQuotedMinor` exists
        on the database row, is deliberately never written, and is never
        serialized. On create/cancel responses the trip-derived fields are null
        (the row is returned bare); the list joins them.
      properties:
        id: { type: string }
        reference: { type: string, description: "BML-B… — unique across bookings AND shipments" }
        status: { $ref: "#/components/schemas/BookingStatus" }
        seats: { type: integer }
        isTest: { type: boolean }
        tripId: { type: string }
        tripReference: { type: [string, "null"] }
        tripStatus: { type: [string, "null"] }
        scheduledDepartureAt: { type: [string, "null"], format: date-time }
        routeName: { type: [string, "null"] }
        from: { type: [string, "null"] }
        to: { type: [string, "null"] }
        confirmedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        cancelledBy:
          oneOf: [ { $ref: "#/components/schemas/CancellationParty" }, { type: "null" } ]
        cancellationReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    PassengerDriverProfileInput:
      type: object
      description: Required fields apply to PUT; PATCH takes any subset. `isTest` is never accepted.
      required: [legalName, displayName, phone, homeDistrict, licenceNumber, licenceExpiry, termsAccepted]
      properties:
        legalName: { type: string, minLength: 1, maxLength: 160 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        phone: { type: string, minLength: 5, maxLength: 40 }
        homeDistrict: { $ref: "#/components/schemas/District" }
        homeAddress: { type: string, maxLength: 200 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        emergencyContactName: { type: string, maxLength: 160 }
        emergencyContactPhone: { type: string, maxLength: 40 }
        licenceNumber: { type: string, minLength: 1, maxLength: 60 }
        licenceExpiry: { type: string, format: date-time }
        termsAccepted: { type: boolean }
        applicantNotes: { type: string, maxLength: 1000 }
    PassengerDriverProfile:
      type: object
      properties:
        id: { type: string }
        legalName: { type: string }
        displayName: { type: string }
        phone: { type: string }
        homeDistrict: { $ref: "#/components/schemas/District" }
        homeAddress: { type: [string, "null"] }
        providerProfileId: { type: [string, "null"], description: "The driver's fleet, set ONLY by mutually consented affiliation acceptance — nothing on this surface writes it" }
        provider:
          type: [object, "null"]
          properties:
            id: { type: string }
            businessName: { type: string }
        emergencyContactName: { type: [string, "null"] }
        emergencyContactPhone: { type: [string, "null"] }
        licenceNumber: { type: string }
        licenceExpiry: { type: string, format: date-time }
        licenceExpiryStatus: { $ref: "#/components/schemas/ExpiryStatus" }
        availability: { $ref: "#/components/schemas/Availability" }
        isActive: { type: boolean }
        isTest: { type: boolean }
        ratingAverage: { type: [number, "null"] }
        completedTrips: { type: integer }
        createdAt: { type: string, format: date-time }
    PassengerProviderProfileInput:
      type: object
      description: Required fields apply to PUT; PATCH takes any subset. `isTest` is never accepted.
      required: [businessName, contactEmail]
      properties:
        businessName: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 2000 }
        contactEmail: { type: string, format: email, maxLength: 320 }
        contactPhone: { type: string, maxLength: 40 }
        district: { $ref: "#/components/schemas/District" }
        city: { type: string, maxLength: 120 }
        addressLine1: { type: string, maxLength: 200 }
        operatingLicenceNumber: { type: string, maxLength: 60 }
        operatingLicenceExpiry: { type: string, format: date-time }
    PassengerProviderProfile:
      type: object
      properties:
        id: { type: string }
        businessName: { type: string }
        description: { type: [string, "null"] }
        contactEmail: { type: string }
        contactPhone: { type: [string, "null"] }
        district:
          oneOf: [ { $ref: "#/components/schemas/District" }, { type: "null" } ]
        city: { type: [string, "null"] }
        addressLine1: { type: [string, "null"] }
        operatingLicenceNumber: { type: [string, "null"] }
        operatingLicenceExpiry: { type: [string, "null"], format: date-time }
        operatingLicenceExpiryStatus: { $ref: "#/components/schemas/ExpiryStatus" }
        isActive: { type: boolean }
        isTest: { type: boolean }
        createdAt: { type: string, format: date-time }
    PassengerVehicleInput:
      type: object
      description: >-
        Required fields apply to POST; PATCH takes any subset and additionally
        accepts isActive. `seatCapacity` is seats available to sell, excluding
        the driver — required at registration because a vehicle with unknown
        capacity can never take a booking. `isTest` is never accepted
        (inherited from the owning profile).
      required: [type, make, model, licencePlate, seatCapacity]
      properties:
        type: { $ref: "#/components/schemas/VehicleType" }
        make: { type: string, minLength: 1, maxLength: 80 }
        model: { type: string, minLength: 1, maxLength: 80 }
        year: { type: integer, minimum: 1900, maximum: 2100 }
        color: { type: string, maxLength: 40 }
        licencePlate: { type: string, minLength: 1, maxLength: 20 }
        registrationNumber: { type: string, maxLength: 60 }
        registrationExpiry: { type: string, format: date-time }
        insuranceProvider: { type: string, maxLength: 120 }
        insurancePolicyNumber: { type: string, maxLength: 80 }
        insuranceExpiry: { type: string, format: date-time }
        seatCapacity: { type: integer, minimum: 1, maximum: 100 }
        isPrimary: { type: boolean }
    PassengerVehicle:
      type: object
      properties:
        id: { type: string }
        type: { $ref: "#/components/schemas/VehicleType" }
        make: { type: string }
        model: { type: string }
        year: { type: [integer, "null"] }
        color: { type: [string, "null"] }
        licencePlate: { type: string }
        registrationNumber: { type: [string, "null"] }
        registrationExpiry: { type: [string, "null"], format: date-time }
        registrationExpiryStatus: { $ref: "#/components/schemas/ExpiryStatus" }
        insuranceProvider: { type: [string, "null"] }
        insuranceExpiry: { type: [string, "null"], format: date-time }
        insuranceExpiryStatus: { $ref: "#/components/schemas/ExpiryStatus" }
        seatCapacity: { type: integer }
        isActive: { type: boolean }
        isPrimary: { type: boolean }
        approvalStatus: { $ref: "#/components/schemas/ApprovalStatus" }
        rejectionReason: { type: [string, "null"] }
    DriverTrip:
      type: object
      properties:
        id: { type: string }
        reference: { type: string }
        status: { $ref: "#/components/schemas/TripStatus" }
        scheduledDepartureAt: { type: [string, "null"], format: date-time }
        routeName: { type: [string, "null"] }
        from: { type: [string, "null"] }
        to: { type: [string, "null"] }
        operator: { type: [string, "null"] }
        seatCapacity: { type: [integer, "null"] }
    TripTransitionResult:
      type: object
      description: start returns startedAt; complete returns completedAt
      properties:
        id: { type: string }
        reference: { type: string }
        status: { $ref: "#/components/schemas/TripStatus" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    AffiliationStatus:
      type: string
      enum: [PENDING, ACCEPTED, DECLINED, WITHDRAWN, ENDED]
    AffiliationParty:
      type: string
      enum: [DRIVER, PROVIDER]
    RouteStopInput:
      type: object
      description: Order comes from array position — a client never numbers stops itself
      required: [district, city]
      properties:
        district: { $ref: "#/components/schemas/District" }
        city: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, maxLength: 120 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    RouteInput:
      type: object
      description: >-
        Required fields apply to create; PATCH takes any subset (stops
        excluded — PUT the stops route) and additionally accepts isActive.
        `isTest` is never accepted: a route inherits the owning operator's
        boundary side.
      required: [name, originDistrict, originCity, destinationDistrict, destinationCity]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        originDistrict: { $ref: "#/components/schemas/District" }
        originCity: { type: string, minLength: 1, maxLength: 120 }
        destinationDistrict: { $ref: "#/components/schemas/District" }
        destinationCity: { type: string, minLength: 1, maxLength: 120 }
        scheduleNote: { type: string, maxLength: 200, description: "A label the operator writes, reported verbatim — not a calendar" }
        durationMinutes: { type: integer, minimum: 1, maximum: 10080 }
        baseFareMinor:
          type: integer
          minimum: 0
          maximum: 100000000
          description: >-
            The operator's commercial declaration, BZD minor units, stored
            verbatim. Zero means "not priced yet" and keeps the booking gate
            closed. Nothing computes, multiplies or charges with it — per seat
            vs per booking is unset commercial policy.
        stops:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/RouteStopInput" }
          description: Create only — updates go through the stops route
    OperatorRoute:
      type: object
      description: >-
        The route as its operator (or an admin) sees it
        (`serializeRoute`, `passenger-network.service.ts`). `stops`, `provider`
        and `tripCount` appear when the view loads them: operator/admin lists
        and the by-id reads include stops and tripCount; admin views add the
        provider identity.
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        originDistrict: { $ref: "#/components/schemas/District" }
        originCity: { type: string }
        destinationDistrict: { $ref: "#/components/schemas/District" }
        destinationCity: { type: string }
        scheduleNote: { type: [string, "null"] }
        durationMinutes: { type: [integer, "null"] }
        baseFareMinor: { $ref: "#/components/schemas/BaseFareMinor" }
        isActive: { type: boolean }
        isTest: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        stops:
          type: array
          items:
            allOf: [ { $ref: "#/components/schemas/RouteStop" } ]
            properties:
              id: { type: string }
        provider:
          type: object
          properties:
            id: { type: string }
            businessName: { type: string }
        tripCount: { type: integer }
    TripCreateInput:
      type: object
      required: [routeId, scheduledDepartureAt]
      properties:
        routeId: { type: string }
        scheduledDepartureAt: { type: string, format: date-time }
        scheduledArrivalAt: { type: string, format: date-time, description: Must be after departure }
    OperatorTrip:
      type: object
      description: >-
        A departure as its operator (or an admin) sees it (`serializeTrip`).
        Staffing is see-able because it is act-able: driver and vehicle
        identity appear once assigned. `seatsConfirmed`/`seatsRemaining`
        appear on list views (only CONFIRMED bookings spend seats);
        `seatsRemaining` is null until a vehicle is assigned.
      properties:
        id: { type: string }
        reference: { type: string, description: "BML-T… — unique across trips AND shipments" }
        kind: { type: string, enum: [SCHEDULED, ON_DEMAND], description: Every creatable trip is SCHEDULED; ON_DEMAND has no writer }
        status: { $ref: "#/components/schemas/TripStatus" }
        isTest: { type: boolean }
        routeId: { type: [string, "null"] }
        routeName: { type: [string, "null"] }
        providerProfileId: { type: [string, "null"] }
        providerName: { type: [string, "null"] }
        driverProfileId: { type: [string, "null"] }
        driverName: { type: [string, "null"] }
        vehicleId: { type: [string, "null"] }
        vehicle:
          type: [object, "null"]
          properties:
            make: { type: string }
            model: { type: string }
            licencePlate: { type: string }
        seatCapacity: { type: [integer, "null"], description: Snapshotted from the vehicle at assignment }
        seatsConfirmed: { type: integer }
        seatsRemaining: { type: [integer, "null"] }
        scheduledDepartureAt: { type: [string, "null"], format: date-time }
        scheduledArrivalAt: { type: [string, "null"], format: date-time }
        cancelledAt: { type: [string, "null"], format: date-time }
        cancelledBy:
          oneOf: [ { $ref: "#/components/schemas/CancellationParty" }, { type: "null" } ]
        cancellationReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    TripAssignResult:
      type: object
      description: The staffing write's own selection — not a full trip view
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string, const: ASSIGNED }
        driverProfileId: { type: string }
        vehicleId: { type: string }
        seatCapacity: { type: integer }
        assignedAt: { type: string, format: date-time }
    AssignableVehicle:
      type: object
      description: One vehicle the assign endpoint would accept for a specific departure.
      properties:
        id: { type: string }
        type: { type: string }
        make: { type: string }
        model: { type: string }
        year: { type: [integer, "null"] }
        color: { type: [string, "null"] }
        licencePlate: { type: string }
        seatCapacity: { type: integer }
        ownership: { type: string, enum: [FLEET, DRIVER] }
        usableByDriverProfileId:
          type: [string, "null"]
          description: Null for a fleet vehicle (any eligible fleet driver); an id when assign accepts this vehicle only with that driver.
        usableByDriverName: { type: [string, "null"] }
    Affiliation:
      type: object
      description: >-
        Deliberately terms-free — no commission, split or employment field
        exists on the row; adding one re-opens the consent design.
      properties:
        id: { type: string }
        providerProfileId: { type: string }
        driverProfileId: { type: string }
        initiatedBy: { $ref: "#/components/schemas/AffiliationParty" }
        status: { $ref: "#/components/schemas/AffiliationStatus" }
        message: { type: [string, "null"] }
        isTest: { type: boolean }
        acceptedAt: { type: [string, "null"], format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        endedBy:
          oneOf: [ { $ref: "#/components/schemas/AffiliationParty" }, { type: "null" } ]
        createdAt: { type: string, format: date-time }
    ProviderAffiliation:
      allOf: [ { $ref: "#/components/schemas/Affiliation" } ]
      properties:
        driver:
          type: object
          properties:
            id: { type: string }
            displayName: { type: string }
            homeDistrict:
              oneOf: [ { $ref: "#/components/schemas/District" }, { type: "null" } ]
            availability: { $ref: "#/components/schemas/Availability" }
            isActive: { type: boolean }
    DriverAffiliation:
      allOf: [ { $ref: "#/components/schemas/Affiliation" } ]
      properties:
        provider:
          type: object
          properties:
            id: { type: string }
            businessName: { type: string }
            district:
              oneOf: [ { $ref: "#/components/schemas/District" }, { type: "null" } ]
            isActive: { type: boolean }
    StaffBooking:
      allOf: [ { $ref: "#/components/schemas/RiderBooking" } ]
      description: A rider booking plus the passenger's name, for operator and admin lists
      properties:
        passengerName: { type: [string, "null"] }
    TestModeInput:
      type: object
      required: [isTest]
      properties:
        isTest: { type: boolean }
        reason: { type: string, maxLength: 500 }
    AdminDriverRow:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        providerProfileId: { type: [string, "null"], description: "Fleet affiliation, so the assign flow can narrow" }
        name: { type: string }
        email: { type: string }
        displayName: { type: string }
        homeDistrict: { $ref: "#/components/schemas/District" }
        availability: { $ref: "#/components/schemas/Availability" }
        roleStatus: { type: [string, "null"] }
        isActive: { type: boolean }
        isTest: { type: boolean }
        vehicleCount: { type: integer }
        approvedVehicles: { type: integer }
        hasExpiredDocs: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminDriverDetail:
      allOf: [ { $ref: "#/components/schemas/PassengerDriverProfile" } ]
      description: The self-service profile view plus account identity, role status and every owned vehicle
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
        roleStatus: { type: [string, "null"] }
        vehicles:
          type: array
          items: { $ref: "#/components/schemas/PassengerVehicle" }
    AdminProviderRow:
      allOf: [ { $ref: "#/components/schemas/PassengerProviderProfile" } ]
      properties:
        userId: { type: string }
        contactName: { type: string }
        accountEmail: { type: string }
        roleStatus: { type: [string, "null"] }
        vehicleCount: { type: integer }
        approvedVehicles: { type: integer }
        driverCount: { type: integer }
