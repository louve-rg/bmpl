  /checkout:
    post:
      tags: [Orders]
      summary: Checkout the active cart into a PENDING order (transactional; reserves inventory)
      description: >
        Validates every product/variant/storefront + inventory one final time,
        atomically reserves inventory, creates the order graph, and clears the
        cart — all in one transaction. Any failure rolls everything back
        (including reservations). Also creates the payment + wallet-hold foundation
        (M11; no money moves). Supply an `Idempotency-Key` header so a duplicate
        retry replays the same order/payment instead of creating a second one.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string }, description: "Dedupes checkout under distributed retries" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Checkout" } } } }
      responses:
        "201": { description: Order created, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /checkout/delivery-quote:
    post:
      tags: [Orders]
      summary: Pre-checkout delivery quote for the active cart
      security: [{ cookieAuth: [], csrfToken: [] }]
      description: >-
        body { district, vendors?: [{ vendorProfileId, deliveryMethod }] }. A
        DIFFERENT controller from POST /checkout above (same CUSTOMER role) —
        filed under Orders as a checkout-flow read, even though it queries
        each vendor's own delivery-zone configuration internally. Edward REQ 5
        (#255): each DELIVERY vendor's `openingHours`/`hoursExceptions` ride
        along on this same response now, batched in one query rather than one
        per vendor — see `DeliveryQuoteVendor` for what is and is not in them.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryQuote" } } } }
  /orders:
    get:
      tags: [Orders]
      summary: The customer's own order history
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Customer order detail (own orders only)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel my own order — whole order, only while every vendor-order is still PENDING
      description: >-
        Owner-approved scope. The window shuts the moment a vendor begins
        preparing (enforced as a conditional in-transaction write, so a
        concurrent "start preparing" wins or loses atomically). Money moves
        only through the EXISTING release path: a never-authorized payment
        releases its soft hold (no money ever moved); a wallet-paid order
        returns funds via the balanced escrow→customer ESCROW_RELEASE with the
        payment ending CANCELLED. Within the window a payment can never be
        SETTLING or SETTLED — capture starts at pickup confirmation, which is
        outside the window — so post-settlement money is unreachable by
        construction. Idempotent: cancelling an already-cancelled order
        returns it unchanged. A foreign order id answers 404 exactly like a
        missing one.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, description: Optional; shown to the vendor }
      responses:
        "201": { description: The cancelled order, customer view, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The store has already started preparing this order }
  /addresses:
    get:
      tags: [Addresses]
      summary: My saved addresses (default first, then most recently updated)
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SavedAddress" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Addresses]
      summary: Save a new address
      description: The first address a customer saves becomes the default whether or not isDefault was set. Setting isDefault true on any other unsets it on the previous default.
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, fullName, phone, addressLine1, city, district]
              properties:
                label: { type: string, maxLength: 60 }
                fullName: { type: string, maxLength: 120 }
                phone: { type: string }
                email: { type: string }
                company: { type: string }
                addressLine1: { type: string, maxLength: 200 }
                addressLine2: { type: string }
                city: { type: string, maxLength: 120 }
                district: { type: string, enum: [BELIZE, CAYO, COROZAL, ORANGE_WALK, STANN_CREEK, TOLEDO] }
                instructions: { type: string, maxLength: 500 }
                latitude: { type: number }
                longitude: { type: number }
                isDefault: { type: boolean, default: false }
      responses:
        "201": { description: The created address, content: { application/json: { schema: { $ref: "#/components/schemas/SavedAddress" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /addresses/{id}:
    patch:
      tags: [Addresses]
      summary: Update one of my saved addresses (partial)
      description: Someone else's address id answers 404, exactly like a missing one — never 403, so the endpoint cannot be used to discover which ids exist.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Every field from the create body, all optional
      responses:
        "200": { description: The updated address, content: { application/json: { schema: { $ref: "#/components/schemas/SavedAddress" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Addresses]
      summary: Delete one of my saved addresses
      description: Deleting the current default promotes the next most-recently-updated address to default, so the address book never has zero defaults once it has any rows.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean, const: true } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vendor/orders:
