openapi: 3.1.0
info:
  title: BMPL Marketplace API
  version: "2.0.0"
  description: >
    Belize Marketplace & Logistics — Phase 2 marketplace endpoints (categories,
    vendors, products, images, variants, inventory, public catalog/search).
    All paths are under the `/api` prefix. Money is integer minor units (BZD cents).
servers:
  - url: https://bmplapi-production.up.railway.app/api
    description: Production
  - url: http://localhost:4000/api
    description: Local
tags:
  - name: Public
    description: Unauthenticated marketplace browse/search.
  - name: Vendor
    description: Owner-scoped storefront management (requires an APPROVED VENDOR role).
  - name: Admin
    description: Moderation (requires an admin permission).
  - name: Cart
    description: Authenticated customer's own shopping cart (self-scoped; no admin/vendor surface).
  - name: Orders
    description: Checkout + orders. Customer (self), Vendor (own vendor orders), Admin (read-only).
  - name: Payments
    description: Payment & wallet-hold foundation (M11) — read-only. NO money moves; no capture/settlement.
  - name: Wallet
    description: Wallet authorization & escrow (M12). Money moves ONLY customer↔escrow via balanced double-entry.
  - name: Reviews
    description: Verified reviews & ratings (M19) tied to completed transactions. Public reads; customer writes; vendor responses; admin moderation.
  - name: Engagement
    description: Saved products (wishlists) & recently-viewed history (M20). Own-account customer data only; never reserves stock or moves money.
  - name: Discovery
    description: Discovery, cross-sell, personalized recommendations & search typeahead (M21). Deterministic, non-AI; read-only over catalog + ratings + own saved/viewed signals.
  - name: Analytics
    description: Analytics & reporting (M22). Read-only aggregation over orders/payments/settlements. Admin (analytics.read) is platform-wide; vendor is own-store only.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
  parameters:
    productId: { name: productId, in: path, required: true, schema: { type: string } }
    variantIdQuery: { name: variantId, in: query, required: false, schema: { type: string } }
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: Validation failed }
              errors:
                type: array
                items:
                  type: object
                  properties: { path: { type: string }, message: { type: string } }
    Unauthorized: { description: Authentication required }
    Forbidden: { description: Missing role/permission }
    NotFound: { description: Not found or not owned }
    Conflict: { description: State/uniqueness conflict }
  schemas:
    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, "null"] }
        iconName: { type: [string, "null"] }
        imageKey: { type: [string, "null"] }
        featured: { type: boolean }
        isVisible: { type: boolean }
        sortOrder: { type: integer }
        parentId: { type: [string, "null"] }
        children:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    Availability:
      type: object
      properties:
        quantity: { type: integer }
        reserved: { type: integer }
        available: { type: [integer, "null"], description: null when unlimited }
        unlimited: { type: boolean }
        allowBackorders: { type: boolean }
        lowStockThreshold: { type: integer }
        inStock: { type: boolean }
        lowStock: { type: boolean }
        outOfStock: { type: boolean }
    ProductCard:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        brand: { type: [string, "null"] }
        priceMinor: { type: integer }
        salePriceMinor: { type: [integer, "null"] }
        currency: { type: string, example: BZD }
        featured: { type: boolean }
        primaryImageUrl: { type: [string, "null"] }
        inStock: { type: boolean }
        vendor:
          type: object
          properties: { businessName: { type: string }, slug: { type: string } }
        category:
          type: object
          properties: { name: { type: string }, slug: { type: string } }
    ProductList:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductCard" }
    CreateProduct:
      type: object
      required: [title, sku, categoryId, priceMinor]
      properties:
        title: { type: string, minLength: 2, maxLength: 200 }
        slug: { type: string }
        description: { type: string }
        sku: { type: string }
        barcode: { type: string }
        categoryId: { type: string }
        brand: { type: string }
        priceMinor: { type: integer, minimum: 0 }
        salePriceMinor: { type: integer, minimum: 0, description: must be ≤ priceMinor }
        weightGrams: { type: integer }
        lengthMm: { type: integer }
        widthMm: { type: integer }
        heightMm: { type: integer }
        featured: { type: boolean, default: false }
        tags: { type: array, items: { type: string } }
        metaTitle: { type: string }
        metaDescription: { type: string }
        searchKeywords: { type: array, items: { type: string } }
    ImagePresign:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1 }
    InventoryAdjust:
      type: object
      required: [delta, reason]
      properties:
        delta: { type: integer, description: non-zero signed change to on-hand }
        reason: { type: string, enum: [MANUAL, RESTOCK, CORRECTION, BACKORDER] }
        note: { type: string }
    CreateVariant:
      type: object
      required: [optionValueIds]
      properties:
        optionValueIds: { type: array, items: { type: string }, minItems: 1 }
        sku: { type: string }
        barcode: { type: string }
        priceMinor: { type: integer }
        salePriceMinor: { type: integer }
        quantity: { type: integer, default: 0 }
    ModerationDecision:
      type: object
      properties: { note: { type: string, description: required for reject } }
    AddCartItem:
      type: object
      required: [productId]
      properties:
        productId: { type: string }
        variantId: { type: [string, "null"], description: "null/omitted = product-level line" }
        quantity: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    UpdateCartItem:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 10000, description: "≥1; remove the line to reach zero" }
    CartLine:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        variantId: { type: [string, "null"] }
        title: { type: string }
        slug: { type: string }
        variantLabel: { type: [string, "null"] }
        sku: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        currency: { type: string, example: BZD }
        quantity: { type: integer }
        unitPriceMinor: { type: integer, description: "current server-computed price (source of truth)" }
        unitPriceMinorSnapshot: { type: integer, description: "price captured at last add/update" }
        priceChanged: { type: boolean }
        lineSubtotalMinor: { type: integer }
        available: { type: [integer, "null"], description: "null = unlimited/untracked" }
        inStock: { type: boolean }
        issues:
          type: array
          items: { type: string, enum: [PRODUCT_UNAVAILABLE, VENDOR_INACTIVE, VARIANT_REQUIRED, VARIANT_UNAVAILABLE, OUT_OF_STOCK, INSUFFICIENT_STOCK] }
        purchasable: { type: boolean }
    CartVendorGroup:
      type: object
      properties:
        vendorProfileId: { type: string }
        slug: { type: string }
        businessName: { type: string }
        storeStatus: { type: string, enum: [OPEN, CLOSED] }
        subtotalMinor: { type: integer }
        itemCount: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/CartLine" } }
    Cart:
      type: object
      description: >
        The active cart, grouped by vendor. Each vendor group becomes a separate
        vendor order at checkout (M10+). Prices are recomputed on every read.
      properties:
        id: { type: string }
        currency: { type: string, example: BZD }
        itemCount: { type: integer, description: "total quantity across all lines" }
        distinctItemCount: { type: integer }
        subtotalMinor: { type: integer, description: "sum of PURCHASABLE line subtotals only" }
        hasPriceChanges: { type: boolean }
        hasUnavailableItems: { type: boolean }
        vendors: { type: array, items: { $ref: "#/components/schemas/CartVendorGroup" } }
        updatedAt: { type: string, format: date-time }
    OrderAddressInput:
      type: object
      required: [fullName, addressLine1, city, district]
      properties:
        fullName: { type: string }
        phone: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        district: { type: string, enum: [BELIZE, CAYO, COROZAL, ORANGE_WALK, STANN_CREEK, TOLEDO] }
        latitude: { type: number }
        longitude: { type: number }
    Checkout:
      type: object
      description: >
        Checkout the active cart. `vendors` sets per-storefront delivery method +
        notes (any storefront omitted defaults to PICKUP). `deliveryAddress` is
        required when at least one vendor uses DELIVERY. NO prices are accepted —
        the server recalculates and snapshots everything.
      properties:
        vendors:
          type: array
          items:
            type: object
            required: [vendorProfileId, deliveryMethod]
            properties:
              vendorProfileId: { type: string }
              deliveryMethod: { type: string, enum: [PICKUP, DELIVERY] }
              customerNotes: { type: string }
        deliveryAddress: { $ref: "#/components/schemas/OrderAddressInput" }
    OrderItem:
      type: object
      properties:
        productTitle: { type: string }
        variantTitle: { type: [string, "null"] }
        sku: { type: [string, "null"] }
        unitPriceMinor: { type: integer, description: "snapshot at checkout" }
        quantity: { type: integer }
        subtotalMinor: { type: integer }
        currency: { type: string }
        productId: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
    VendorOrder:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string }
        status: { type: string, enum: [PENDING] }
        deliveryMethod: { type: string, enum: [PICKUP, DELIVERY] }
        customerNotes: { type: [string, "null"] }
        currency: { type: string }
        itemCount: { type: integer }
        subtotalMinor: { type: integer }
        vendor: { type: object, properties: { businessName: { type: string }, slug: { type: string } } }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
    Order:
      type: object
      description: A placed order — parent totals + one vendor order per storefront.
      properties:
        id: { type: string }
        orderNumber: { type: string }
        status: { type: string, enum: [PENDING] }
        currency: { type: string, example: BZD }
        itemCount: { type: integer }
        subtotalMinor: { type: integer }
        totalMinor: { type: integer, description: "== subtotalMinor in M10 (no tax/shipping/fees)" }
        placedAt: { type: string, format: date-time }
        deliveryAddress: { type: [object, "null"] }
        vendorOrders: { type: array, items: { $ref: "#/components/schemas/VendorOrder" } }
    WalletHold:
      type: object
      description: A SOFT hold — reservation of intent to pay. Never moves money in M11.
      properties:
        id: { type: string }
        status: { type: string, enum: [HELD, RELEASED] }
        amountMinor: { type: integer }
        currency: { type: string }
        heldAt: { type: string, format: date-time }
        releasedAt: { type: [string, "null"], format: date-time }
        releaseReason: { type: [string, "null"] }
    Payment:
      type: object
      description: >
        A payment for an order (foundation). Created by checkout in CREATED→PENDING
        with a WalletHold (HELD) and a PENDING LedgerReference. NO money moves.
      properties:
        id: { type: string }
        paymentNumber: { type: string }
        status: { type: string, enum: [CREATED, PENDING, AUTHORIZED, FAILED, EXPIRED, CANCELLED] }
        methodType: { type: string, enum: [WALLET, CREDIT_CARD, BANK_TRANSFER] }
        amountMinor: { type: integer }
        currency: { type: string, example: BZD }
        authorizedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        order:
          type: object
          properties:
            id: { type: string }
            orderNumber: { type: string }
            totalMinor: { type: integer }
            vendorOrders: { type: array, items: { type: object, properties: { id: { type: string }, orderNumber: { type: string }, businessName: { type: string }, subtotalMinor: { type: integer } } } }
        holds: { type: array, items: { $ref: "#/components/schemas/WalletHold" } }
        ledgerReferences:
          type: array
          items: { type: object, properties: { id: { type: string }, purpose: { type: string, enum: [CUSTOMER_PAYMENT] }, direction: { type: string, enum: [DEBIT, CREDIT] }, amountMinor: { type: integer }, status: { type: string, enum: [PENDING, POSTED, VOID] }, walletTransactionId: { type: [string, "null"] } } }
        events:
          type: array
          items: { type: object, properties: { type: { type: string }, fromStatus: { type: [string, "null"] }, toStatus: { type: [string, "null"] }, createdAt: { type: string, format: date-time } } }
paths:
  /marketplace/categories:
    get:
      tags: [Public]
      summary: Visible category tree
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Category" } } } } } }
  /marketplace/vendors:
    get:
      tags: [Public]
      summary: Approved vendor directory
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string, enum: [BELIZE, CAYO, COROZAL, ORANGE_WALK, STANN_CREEK, TOLEDO] } }
      responses: { "200": { description: OK } }
  /marketplace/vendors/{slug}:
    get:
      tags: [Public]
      summary: Storefront by slug
      parameters: [ { name: slug, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } }
  /marketplace/products:
    get:
      tags: [Public]
      summary: Catalog search (PostgreSQL full-text + filters)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string }, description: includes the whole subtree }
        - { name: vendorSlug, in: query, schema: { type: string } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: priceMin, in: query, schema: { type: integer }, description: cents }
        - { name: priceMax, in: query, schema: { type: integer }, description: cents }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, newest, price_asc, price_desc, featured] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 24 } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProductList" } } } } }
  /marketplace/products/{slug}:
    get:
      tags: [Public]
      summary: Product detail (gallery, options, variants, availability)
      parameters: [ { name: slug, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } }
  /vendor/profile:
    get: { tags: [Vendor], summary: Own storefront, security: [{ cookieAuth: [] }], responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } } }
    post: { tags: [Vendor], summary: Create profile, security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: Created }, "409": { $ref: "#/components/responses/Conflict" } } }
    patch: { tags: [Vendor], summary: Update profile, security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK } } }
  /vendor/profile/submit:
    post: { tags: [Vendor], summary: Submit for review, security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: PENDING }, "409": { $ref: "#/components/responses/Conflict" } } }
  /vendor/settings:
    patch: { tags: [Vendor], summary: Update operational settings, security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK } } }
  /vendor/profile/locations:
    post: { tags: [Vendor], summary: Add location, security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: Created } } }
  /vendor/profile/locations/{id}:
    patch: { tags: [Vendor], summary: Update location, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    delete: { tags: [Vendor], summary: Delete location, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK } } }
  /vendor/profile/hours:
    put: { tags: [Vendor], summary: Replace opening hours, security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK }, "400": { $ref: "#/components/responses/ValidationError" } } }
  /vendor/profile/logo/presign:
    post: { tags: [Vendor], summary: Presign logo upload (rate-limited), security: [{ cookieAuth: [], csrfToken: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/ImagePresign" } } } }, responses: { "201": { description: presigned URL }, "503": { description: storage not configured } } }
  /vendor/profile/logo/confirm:
    post: { tags: [Vendor], summary: Confirm logo upload, security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: OK }, "400": { $ref: "#/components/responses/ValidationError" } } }
  /vendor/profile/banner/presign:
    post: { tags: [Vendor], summary: Presign banner upload (rate-limited), security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: presigned URL }, "503": { description: storage not configured } } }
  /vendor/profile/banner/confirm:
    post: { tags: [Vendor], summary: Confirm banner upload, security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: OK } } }
  /vendor/products:
    get: { tags: [Vendor], summary: List own products, security: [{ cookieAuth: [] }], responses: { "200": { description: OK } } }
    post: { tags: [Vendor], summary: Create product (DRAFT), security: [{ cookieAuth: [], csrfToken: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/CreateProduct" } } } }, responses: { "201": { description: Created }, "400": { $ref: "#/components/responses/ValidationError" }, "409": { $ref: "#/components/responses/Conflict" } } }
  /vendor/products/{id}:
    get: { tags: [Vendor], summary: Own product detail, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [] }], responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } } }
    patch: { tags: [Vendor], summary: Update product, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK } } }
    delete: { tags: [Vendor], summary: Delete a DRAFT product, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK }, "409": { $ref: "#/components/responses/Conflict" } } }
  /vendor/products/{id}/submit:
    post: { tags: [Vendor], summary: Submit product for review, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: PENDING_REVIEW } } }
  /vendor/products/{id}/archive:
    post: { tags: [Vendor], summary: Archive product, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: ARCHIVED } } }
  /vendor/products/{id}/unarchive:
    post: { tags: [Vendor], summary: Unarchive to DRAFT, parameters: [ { name: id, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: DRAFT } } }
  /vendor/products/{productId}/images:
    get: { tags: [Vendor], summary: List images, parameters: [ { $ref: "#/components/parameters/productId" } ], security: [{ cookieAuth: [] }], responses: { "200": { description: OK } } }
  /vendor/products/{productId}/images/presign:
    post: { tags: [Vendor], summary: Presign image upload (rate-limited), parameters: [ { $ref: "#/components/parameters/productId" } ], security: [{ cookieAuth: [], csrfToken: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/ImagePresign" } } } }, responses: { "201": { description: presigned URL }, "400": { $ref: "#/components/responses/ValidationError" }, "503": { description: storage not configured } } }
  /vendor/products/{productId}/images/confirm:
    post: { tags: [Vendor], summary: Confirm image (headObject verify), parameters: [ { $ref: "#/components/parameters/productId" } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: OK }, "400": { $ref: "#/components/responses/ValidationError" } } }
  /vendor/products/{productId}/images/reorder:
    post: { tags: [Vendor], summary: Reorder images, parameters: [ { $ref: "#/components/parameters/productId" } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: OK } } }
  /vendor/products/{productId}/images/{imageId}/primary:
    post: { tags: [Vendor], summary: Set primary image, parameters: [ { $ref: "#/components/parameters/productId" }, { name: imageId, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: OK } } }
  /vendor/products/{productId}/images/{imageId}:
    patch: { tags: [Vendor], summary: Update alt/caption, parameters: [ { $ref: "#/components/parameters/productId" }, { name: imageId, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK } } }
    delete: { tags: [Vendor], summary: Delete image, parameters: [ { $ref: "#/components/parameters/productId" }, { name: imageId, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK } } }
  /vendor/products/{productId}/variants:
    get: { tags: [Vendor], summary: Options + variants, parameters: [ { $ref: "#/components/parameters/productId" } ], security: [{ cookieAuth: [] }], responses: { "200": { description: OK } } }
    post: { tags: [Vendor], summary: Create variant, parameters: [ { $ref: "#/components/parameters/productId" } ], security: [{ cookieAuth: [], csrfToken: [] }], requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/CreateVariant" } } } }, responses: { "201": { description: OK }, "400": { $ref: "#/components/responses/ValidationError" }, "409": { $ref: "#/components/responses/Conflict" } } }
  /vendor/products/{productId}/options:
    post: { tags: [Vendor], summary: Create option, parameters: [ { $ref: "#/components/parameters/productId" } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: OK }, "409": { $ref: "#/components/responses/Conflict" } } }
  /vendor/products/{productId}/options/{optionId}/values:
    post: { tags: [Vendor], summary: Add option value, parameters: [ { $ref: "#/components/parameters/productId" }, { name: optionId, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: OK } } }
  /vendor/products/{productId}/options/{optionId}:
    delete: { tags: [Vendor], summary: Delete option, parameters: [ { $ref: "#/components/parameters/productId" }, { name: optionId, in: path, required: true, schema: { type: string } } ], security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK }, "409": { $ref: "#/components/responses/Conflict" } } }
  /vendor/products/{productId}/option-values/{valueId}:
