    post:
      tags: [Cart]
      summary: Add an item (merges onto an identical existing line)
      description: >
        Rejects an unpublished product, an inactive storefront, a required/invalid
        variant (400), and insufficient stock (409). No inventory is reserved.
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddCartItem" } } } }
      responses: { "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
  /cart/items/{itemId}:
    patch:
      tags: [Cart]
      summary: Set a line's quantity (≥1)
      parameters: [ { name: itemId, in: path, required: true, schema: { type: string } } ]
      security: [{ cookieAuth: [], csrfToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UpdateCartItem" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" }, "409": { $ref: "#/components/responses/Conflict" } }
    delete:
      tags: [Cart]
      summary: Remove a single line
      parameters: [ { name: itemId, in: path, required: true, schema: { type: string } } ]
      security: [{ cookieAuth: [], csrfToken: [] }]
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Cart" } } } }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
  /checkout:
    post:
      tags: [Orders]
      summary: Checkout the active cart into a PENDING order (transactional; reserves inventory)
      description: >
        Validates every product/variant/storefront + inventory one final time,
        atomically reserves inventory, creates the order graph, and clears the
        cart — all in one transaction. Any failure rolls everything back
        (including reservations). Also creates the payment + wallet-hold foundation
        (M11; no money moves). Supply an `Idempotency-Key` header so a duplicate
        retry replays the same order/payment instead of creating a second one.
      security: [{ cookieAuth: [], csrfToken: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string }, description: "Dedupes checkout under distributed retries" }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Checkout" } } } }
      responses:
        "201": { description: Order created, content: { application/json: { schema: { $ref: "#/components/schemas/Order" } } } }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
