openapi: 3.1.0
info:
  title: BMPL Marketplace API
  version: "2.0.0"
  description: >
    Belize Marketplace & Logistics — the marketplace surface and what grew on
    it: catalog/search, vendors, products, cart, checkout/orders, payments &
    wallet, marketplace dispatch & delivery (M15), settlement (M18), reviews,
    jobs. The multimodal shipping surface (/shipping/*, courier legs,
    hubs/modes, admin logistics) is documented separately in shipping.yaml in
    this directory, and the complete passenger surface (rider, driver,
    operator, network, affiliation, admin) in passenger.yaml beside it. The
    DELIVERY_DRIVER's own profile/vehicle/service-area/availability surface
    (`/driver/profile`, `/driver/vehicles`, `/driver/service-areas`,
    `/driver/availability` — a different controller from the `/driver/jobs`
    and `/driver/earnings` documented right here) is in driver.yaml beside it.
    All paths are under the `/api`
    prefix. Money is integer minor units (BZD cents); wallet/ledger amounts
    are BigInt-backed and serialize as JSON strings on wallet surfaces, while
    delivery/shipping fee fields serialize as JSON numbers — verify per
    endpoint before assuming either.
servers:
  - url: https://bmplapi-production.up.railway.app/api
    description: Production
  - url: http://localhost:4000/api
    description: Local
tags:
  - name: Public
    description: Unauthenticated marketplace browse/search.
  - name: Vendor
    description: Owner-scoped storefront management (requires an APPROVED VENDOR role).
  - name: Products
    description: Vendor product brand-image role (M6.2) — marks/clears which image represents the product's brand. A small, separate feature from the ordinary image CRUD under Vendor above.
  - name: Admin
    description: Moderation (requires an admin permission).
  - name: Cart
    description: Authenticated customer's own shopping cart (self-scoped; no admin/vendor surface).
  - name: Addresses
    description: The signed-in customer's own saved address book (BMPL-181). Self-scoped throughout; a foreign address id 404s, never 403.
  - name: Orders
    description: Checkout + orders. Customer (self), Vendor (own vendor orders), Admin (read-only).
  - name: Payments
    description: >-
      Payment & wallet-hold surface (M11/M12). Internal wallet money only.
      Settlement (M18) exists and releases escrow internally (see the
      /admin/settlements and /orders/{id}/settlement paths); there is still no
      external capture, payout, refund-to-source or withdrawal anywhere.
  - name: Wallet
    description: >-
      Wallet authorization & escrow (M12) plus internal settlement (M18). Every
      movement is a balanced double-entry transaction between internal
      accounts — customer↔escrow at authorization, escrow→vendor/driver/platform
      fees at settlement. No external money rail exists.
  - name: Dispatch
    description: >-
      Marketplace dispatch & delivery execution (M15). Admin assignment,
      reassignment and cancellation; the driver's own job feed and delivery
      lifecycle; read-only PIN/proof/timeline views for admin, driver, vendor
      and customer, each scoped to their own relationship to the delivery.
  - name: Notifications
    description: In-app notifications & event system (M16). Own-account only; read/unread state and delivery preferences.
  - name: Messaging
    description: >-
      Order/delivery conversations and platform support threads (M17).
      Self-scoped for customer/vendor/driver; admin support queue join,
      respond and internal notes.
  - name: Settlement
    description: >-
      Settlement & earnings (M18 — internal, no payouts). Vendor and driver
      settlement history, admin reconciliation and fee configuration.
      Releases escrow internally; never moves money externally.
  - name: Reviews
    description: Verified reviews & ratings (M19) tied to completed transactions. Public reads; customer writes; vendor responses; admin moderation.
  - name: Engagement
    description: Saved products (wishlists) & recently-viewed history (M20). Own-account customer data only; never reserves stock or moves money.
  - name: Discovery
    description: Discovery, cross-sell, personalized recommendations & search typeahead (M21). Deterministic, non-AI; read-only over catalog + ratings + own saved/viewed signals.
  - name: Analytics
    description: Analytics & reporting (M22). Read-only aggregation over orders/payments/settlements. Admin (analytics.read) is platform-wide; vendor is own-store only.
  - name: Operations
    description: Platform operations (M23). Ops console action queues (ops.read), announcement/maintenance banner (ops.manage; public read; display-only), audit CSV export (audit.read).
  - name: Jobs
    description: Belize Connect — Jobs & Employment (M24). Public browse; job-seeker profiles/résumés/applications; employer company + jobs + applicant pipeline; admin moderation. Reuses roles, approval, messaging, notifications, storage, moderation.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    csrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
  parameters:
    productId: { name: productId, in: path, required: true, schema: { type: string } }
    variantIdQuery: { name: variantId, in: query, required: false, schema: { type: string } }
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: Validation failed }
              errors:
                type: array
                items:
                  type: object
                  properties: { path: { type: string }, message: { type: string } }
    Unauthorized: { description: Authentication required }
    Forbidden: { description: Missing role/permission }
    NotFound: { description: Not found or not owned }
    Conflict: { description: State/uniqueness conflict }
  schemas:
    SavedAddress:
      type: object
      description: One entry in the customer's own address book (BMPL-181). Free-form district/city text, matching the delivery-address convention elsewhere — never a fabricated place list.
      properties:
        id: { type: string }
        userId: { type: string }
        label: { type: string, maxLength: 60 }
        fullName: { type: string, maxLength: 120 }
        phone: { type: string }
        email: { type: [string, "null"] }
        company: { type: [string, "null"] }
        addressLine1: { type: string, maxLength: 200 }
        addressLine2: { type: [string, "null"] }
        city: { type: string, maxLength: 120 }
        district: { type: string, enum: [BELIZE, CAYO, COROZAL, ORANGE_WALK, STANN_CREEK, TOLEDO] }
        instructions: { type: [string, "null"] }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        isDefault: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Category:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, "null"] }
        iconName: { type: [string, "null"] }
        imageKey: { type: [string, "null"] }
        featured: { type: boolean }
        isVisible: { type: boolean }
        sortOrder: { type: integer }
        parentId: { type: [string, "null"] }
        children:
          type: array
          items: { $ref: "#/components/schemas/Category" }
    Availability:
      type: object
      properties:
        quantity: { type: integer }
        reserved: { type: integer }
        available: { type: [integer, "null"], description: null when unlimited }
        unlimited: { type: boolean }
        allowBackorders: { type: boolean }
        lowStockThreshold: { type: integer }
        inStock: { type: boolean }
        lowStock: { type: boolean }
        outOfStock: { type: boolean }
    ProductCard:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        slug: { type: string }
        brand: { type: [string, "null"] }
        priceMinor: { type: integer }
        salePriceMinor: { type: [integer, "null"] }
        currency: { type: string, example: BZD }
        featured: { type: boolean }
        primaryImageUrl: { type: [string, "null"] }
        inStock: { type: boolean }
        vendor:
          type: object
          properties: { businessName: { type: string }, slug: { type: string } }
        category:
          type: object
          properties: { name: { type: string }, slug: { type: string } }
    ProductList:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/ProductCard" }
    CreateProduct:
      type: object
      required: [title, sku, categoryId, priceMinor]
      properties:
        title: { type: string, minLength: 2, maxLength: 200 }
        slug: { type: string }
        description: { type: string }
        sku: { type: string }
        barcode: { type: string }
        categoryId: { type: string }
        brand: { type: string }
        priceMinor: { type: integer, minimum: 0 }
        salePriceMinor: { type: integer, minimum: 0, description: must be ≤ priceMinor }
        weightGrams: { type: integer }
        lengthMm: { type: integer }
        widthMm: { type: integer }
        heightMm: { type: integer }
        featured: { type: boolean, default: false }
        tags: { type: array, items: { type: string } }
        metaTitle: { type: string }
        metaDescription: { type: string }
        searchKeywords: { type: array, items: { type: string } }
    ImagePresign:
      type: object
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, minimum: 1 }
    InventoryAdjust:
      type: object
      required: [delta, reason]
      properties:
        delta: { type: integer, description: non-zero signed change to on-hand }
        reason: { type: string, enum: [MANUAL, RESTOCK, CORRECTION, BACKORDER] }
        note: { type: string }
    CreateVariant:
      type: object
      required: [optionValueIds]
      properties:
        optionValueIds: { type: array, items: { type: string }, minItems: 1 }
        sku: { type: string }
        barcode: { type: string }
        priceMinor: { type: integer }
        salePriceMinor: { type: integer }
        quantity: { type: integer, default: 0 }
    ModerationDecision:
      type: object
      properties: { note: { type: string, description: required for reject } }
    AddCartItem:
      type: object
      required: [productId]
      properties:
        productId: { type: string }
        variantId: { type: [string, "null"], description: "null/omitted = product-level line" }
        quantity: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    UpdateCartItem:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 10000, description: "≥1; remove the line to reach zero" }
    CartLine:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        variantId: { type: [string, "null"] }
        title: { type: string }
        slug: { type: string }
        variantLabel: { type: [string, "null"] }
        sku: { type: [string, "null"] }
        imageUrl: { type: [string, "null"] }
        currency: { type: string, example: BZD }
        quantity: { type: integer }
        unitPriceMinor: { type: integer, description: "current server-computed price (source of truth)" }
        unitPriceMinorSnapshot: { type: integer, description: "price captured at last add/update" }
        priceChanged: { type: boolean }
        lineSubtotalMinor: { type: integer }
        available: { type: [integer, "null"], description: "null = unlimited/untracked" }
        inStock: { type: boolean }
        issues:
          type: array
          items: { type: string, enum: [PRODUCT_UNAVAILABLE, VENDOR_INACTIVE, VARIANT_REQUIRED, VARIANT_UNAVAILABLE, OUT_OF_STOCK, INSUFFICIENT_STOCK] }
        purchasable: { type: boolean }
    CartVendorGroup:
      type: object
      properties:
        vendorProfileId: { type: string }
        slug: { type: string }
        businessName: { type: string }
        storeStatus: { type: string, enum: [OPEN, CLOSED] }
        subtotalMinor: { type: integer }
        itemCount: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/CartLine" } }
    Cart:
      type: object
      description: >
        The active cart, grouped by vendor. Each vendor group becomes a separate
        vendor order at checkout (M10+). Prices are recomputed on every read.
      properties:
        id: { type: string }
        currency: { type: string, example: BZD }
        itemCount: { type: integer, description: "total quantity across all lines" }
        distinctItemCount: { type: integer }
        subtotalMinor: { type: integer, description: "sum of PURCHASABLE line subtotals only" }
        hasPriceChanges: { type: boolean }
        hasUnavailableItems: { type: boolean }
        vendors: { type: array, items: { $ref: "#/components/schemas/CartVendorGroup" } }
        updatedAt: { type: string, format: date-time }
    OrderAddressInput:
      type: object
      required: [fullName, addressLine1, city, district]
      properties:
        fullName: { type: string }
        phone: { type: string }
        addressLine1: { type: string }
        addressLine2: { type: string }
        city: { type: string }
        district: { type: string, enum: [BELIZE, CAYO, COROZAL, ORANGE_WALK, STANN_CREEK, TOLEDO] }
        latitude: { type: number }
        longitude: { type: number }
    Checkout:
      type: object
      description: >
        Checkout the active cart. `vendors` sets per-storefront delivery method +
        notes (any storefront omitted defaults to PICKUP). `deliveryAddress` is
        required when at least one vendor uses DELIVERY. NO prices are accepted —
        the server recalculates and snapshots everything.
      properties:
        vendors:
          type: array
          items:
            type: object
            required: [vendorProfileId, deliveryMethod]
            properties:
              vendorProfileId: { type: string }
              deliveryMethod: { type: string, enum: [PICKUP, DELIVERY] }
              customerNotes: { type: string }
        deliveryAddress: { $ref: "#/components/schemas/OrderAddressInput" }
    OrderItem:
      type: object
      properties:
        productTitle: { type: string }
        variantTitle: { type: [string, "null"] }
        sku: { type: [string, "null"] }
        unitPriceMinor: { type: integer, description: "snapshot at checkout" }
        quantity: { type: integer }
        subtotalMinor: { type: integer }
        currency: { type: string }
        productId: { type: [string, "null"] }
        imageUrl:
          type: [string, "null"]
          description: >-
            Snapshot taken at checkout: the exact variant's primary image, else
            the product's own (non-brand) primary, else null — COPIED to an
            immutable order-scoped object, so a later vendor edit or delete of
            the listing image cannot break or rewrite the line. The storefront
            brand image is never an order-line image. Pre-snapshot rows (and
            rows whose copy failed) resolve live by the same rule.
    VendorOrder:
      type: object
      properties:
        id: { type: string }
        orderNumber: { type: string }
        status: { type: string, enum: [PENDING] }
        deliveryMethod: { type: string, enum: [PICKUP, DELIVERY] }
        customerNotes: { type: [string, "null"] }
        currency: { type: string }
        itemCount: { type: integer }
        subtotalMinor: { type: integer }
        vendor: { type: object, properties: { businessName: { type: string }, slug: { type: string } } }
        items: { type: array, items: { $ref: "#/components/schemas/OrderItem" } }
        delivery:
          type: [object, "null"]
          description: "Present only for DELIVERY vendor-orders (M13 snapshot)."
          properties:
            id: { type: string }
            status: { type: string }
            stage:
              type: [string, "null"]
              enum: [AWAITING_VENDOR, AWAITING_DISPATCH, OFFERED, null]
              description: >-
                The honest pre-collection stage: AWAITING_VENDOR until the
                store marks the order ready, AWAITING_DISPATCH while ready and
                unassigned (fresh or declined), OFFERED while a driver has the
                offer but has not accepted. Null once a driver accepted or the
                delivery finished — the status label is truthful from there.
            stageLabel: { type: [string, "null"], description: "Customer-safe label for stage (DELIVERY_STAGE_LABELS)." }
            feeMinor: { type: integer }
            freeApplied: { type: boolean }
            estimate: { type: [object, "null"] }
            instructions: { type: [string, "null"] }
    Order:
      type: object
      description: A placed order — parent totals + one vendor order per storefront.
      properties:
        id: { type: string }
        orderNumber: { type: string }
        status: { type: string, enum: [PENDING] }
        currency: { type: string, example: BZD }
        itemCount: { type: integer }
        subtotalMinor: { type: integer }
        totalMinor: { type: integer, description: "== subtotalMinor in M10 (no tax/shipping/fees)" }
        placedAt: { type: string, format: date-time }
        deliveryAddress: { type: [object, "null"] }
        vendorOrders: { type: array, items: { $ref: "#/components/schemas/VendorOrder" } }
    WalletHold:
      type: object
      description: A SOFT hold — reservation of intent to pay. Never moves money in M11.
      properties:
        id: { type: string }
        status: { type: string, enum: [HELD, RELEASED] }
        amountMinor: { type: integer }
        currency: { type: string }
        heldAt: { type: string, format: date-time }
        releasedAt: { type: [string, "null"], format: date-time }
        releaseReason: { type: [string, "null"] }
    Payment:
      type: object
      description: >
        A payment for an order (foundation). Created by checkout in CREATED→PENDING
        with a WalletHold (HELD) and a PENDING LedgerReference. NO money moves.
      properties:
        id: { type: string }
        paymentNumber: { type: string }
        status: { type: string, enum: [CREATED, PENDING, AUTHORIZED, FAILED, EXPIRED, CANCELLED] }
        methodType: { type: string, enum: [WALLET, CREDIT_CARD, BANK_TRANSFER] }
        amountMinor: { type: integer }
        currency: { type: string, example: BZD }
        authorizedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        order:
          type: object
          properties:
            id: { type: string }
            orderNumber: { type: string }
            totalMinor: { type: integer }
            vendorOrders: { type: array, items: { type: object, properties: { id: { type: string }, orderNumber: { type: string }, businessName: { type: string }, subtotalMinor: { type: integer } } } }
        holds: { type: array, items: { $ref: "#/components/schemas/WalletHold" } }
        ledgerReferences:
          type: array
          items: { type: object, properties: { id: { type: string }, purpose: { type: string, enum: [CUSTOMER_PAYMENT] }, direction: { type: string, enum: [DEBIT, CREDIT] }, amountMinor: { type: integer }, status: { type: string, enum: [PENDING, POSTED, VOID] }, walletTransactionId: { type: [string, "null"] } } }
        events:
          type: array
          items: { type: object, properties: { type: { type: string }, fromStatus: { type: [string, "null"] }, toStatus: { type: [string, "null"] }, createdAt: { type: string, format: date-time } } }
    VendorOpeningHour:
      type: object
      description: One weekly recurring day. A day missing from the array is unconstrained, not closed — the resolver's own documented default.
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6, description: 0=Sunday .. 6=Saturday }
        isClosed: { type: boolean }
        openTime: { type: [string, "null"], description: "HH:MM, Belize local; null when isClosed" }
        closeTime: { type: [string, "null"], description: "HH:MM, Belize local; null when isClosed" }
    VendorHoursException:
      type: object
      description: >-
        A date-specific override of the weekly pattern above (a holiday, a
        one-off closure, a changed schedule). Exactly these four fields —
        never `reason` or `createdByUserId`, both of which exist on the
        underlying row but are deliberately excluded from the select that
        produces this (BMPL-338/#255). A vendor's reason for closing is their
        own; the client needs to know whether they are open, not why they
        are shut. Absence of an exception for a date means the weekly
        pattern above applies unchanged.
      properties:
        date: { type: string, format: date, description: "YYYY-MM-DD, Belize calendar date" }
        status: { type: string, enum: [CLOSED, MODIFIED] }
        openTime: { type: [string, "null"], description: "HH:MM, Belize local; set only when status is MODIFIED" }
        closeTime: { type: [string, "null"], description: "HH:MM, Belize local; set only when status is MODIFIED" }
    DeliveryQuoteVendor:
      type: object
      description: One cart vendor's delivery quote, or its PICKUP placeholder when the customer chose pickup for that storefront.
      properties:
        vendorProfileId: { type: string }
        businessName: { type: string }
        deliveryMethod: { type: string, enum: [PICKUP, DELIVERY] }
        deliverable: { type: boolean }
        reason:
          type: [string, "null"]
          enum: [PICKUP_ONLY, BELOW_MINIMUM, DISTRICT_NOT_SERVED, null]
          description: Why deliverable is false. Null when deliverable is true, or whenever deliveryMethod is PICKUP.
        feeMinor: { type: integer, description: "0 when deliveryMethod is PICKUP or deliverable is false" }
        freeApplied: { type: boolean }
        estimate:
          type: [object, "null"]
          description: Null when this vendor has configured no delivery estimate, or deliveryMethod is PICKUP.
          properties:
            minHours: { type: integer }
            maxHours: { type: integer }
            label: { type: [string, "null"] }
        minimumOrderMinor: { type: [integer, "null"] }
        openingHours:
          type: array
          items: { $ref: "#/components/schemas/VendorOpeningHour" }
          description: >-
            Edward REQ 5 (#255). Empty when deliveryMethod is PICKUP, or when
            this vendor has configured no weekly hours at all — never
            omitted, so a client can tell "no hours configured" (empty
            array) from "closed today" (a configured day with isClosed
            true) without a separate flag. Powers the web client's own
            "may close before your order arrives" warning, computed there
            from this data and the estimate above — never a second
            server-side calculation.
        hoursExceptions:
          type: array
          items: { $ref: "#/components/schemas/VendorHoursException" }
          description: Edward REQ 5 (#255). Empty under the same two conditions as openingHours above.
    DeliveryQuote:
      type: object
      description: Pre-checkout delivery quote for the active cart — one entry per vendor represented in the cart.
      properties:
        district: { type: string, enum: [BELIZE, CAYO, COROZAL, ORANGE_WALK, STANN_CREEK, TOLEDO] }
        vendors: { type: array, items: { $ref: "#/components/schemas/DeliveryQuoteVendor" } }
        subtotalMinor: { type: integer }
        deliveryFeeMinor: { type: integer, description: Sum of every deliverable vendor's feeMinor above. }
        totalMinor: { type: integer }
paths:
  /marketplace/categories:
    get:
      tags: [Public]
      summary: Visible category tree
      responses: { "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Category" } } } } } }
  /marketplace/vendors:
    get:
      tags: [Public]
      summary: Approved vendor directory
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string, enum: [BELIZE, CAYO, COROZAL, ORANGE_WALK, STANN_CREEK, TOLEDO] } }
      responses: { "200": { description: OK } }
  /marketplace/vendors/{slug}:
    get:
      tags: [Public]
      summary: Storefront by slug
      parameters: [ { name: slug, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } }
  /marketplace/products:
    get:
      tags: [Public]
      summary: Catalog search (PostgreSQL full-text + filters)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: categoryId, in: query, schema: { type: string }, description: includes the whole subtree }
        - { name: vendorSlug, in: query, schema: { type: string } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: priceMin, in: query, schema: { type: integer }, description: cents }
        - { name: priceMax, in: query, schema: { type: integer }, description: cents }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, newest, price_asc, price_desc, featured] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 48, default: 24 } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProductList" } } } } }
  /marketplace/products/{slug}:
    get:
      tags: [Public]
      summary: Product detail (gallery, options, variants, availability)
      parameters: [ { name: slug, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: OK }, "404": { $ref: "#/components/responses/NotFound" } }
  /vendor/profile:
    get: { tags: [Vendor], summary: Own storefront, security: [{ cookieAuth: [] }], responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } } }
    post: { tags: [Vendor], summary: Create profile, security: [{ cookieAuth: [], csrfToken: [] }], responses: { "201": { description: Created }, "409": { $ref: "#/components/responses/Conflict" } } }
    patch: { tags: [Vendor], summary: Update profile, security: [{ cookieAuth: [], csrfToken: [] }], responses: { "200": { description: OK } } }
