name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# PRODUCTION DEPLOY MECHANISM, EVIDENCED (gh api repos/.../deployments +
# /statuses against environment "carefree-achievement / production"; full
# instrument in docs/DEPLOYMENT.md §2a) — this corrects a wrong claim this
# comment used to make, and the matching one below on "Browser tests":
# Railway does NOT wait for this check suite before starting an apps/api
# build. 6c1ea8f's (#405) production deployment went in_progress TWO
# SECONDS after the push (04:06:42Z; the push was 04:06:40Z) — long before
# any check suite here could possibly have concluded. What IS evidenced: a
# LATER push to main marks an already-in-flight deployment INACTIVE
# (superseded), whether or not that later push creates a production
# deployment of its own. 6c1ea8f's deployment went in_progress → INACTIVE
# at 04:18:53Z, 28 seconds after the NEXT main push's own CI run started
# (04:18:25Z) — and that next push (510c783, #406) was web-only, matched
# none of railway.json's build.watchPatterns, and created NO production
# deployment of its own. A web-only merge killed an in-flight API deploy
# without replacing it, and the API then kept serving the superseded
# commit's predecessor (817bf5c) for the next ~15 hours. Rerunning
# 6c1ea8f's cancelled suite came back SUCCESS but produced NO new
# deployment attempt — a suite rerun does not revive/recreate a Railway
# deployment for a commit that is no longer main's tip. The freeze ended
# when the next API-touching commit (fbd8e7f, #407) reached main and
# deployed cleanly on its own; see docs/DEPLOYMENT.md §2a for the full
# evidence trail.
#
# Whether or how THIS check suite's own pass/fail result factors into
# Railway's deployment outcome at all is UNESTABLISHED — we have no
# evidence either way, and this comment will not assert a second unverified
# mechanism in place of the first. Do not restate "Railway waits for check
# suites" anywhere in this file; cite the deployment status history above
# instead, and see docs/DEPLOYMENT.md §2a before theorising further.
#
# THE REAL PROTECTIVE RULE: never merge anything to main while a production
# deployment is in_progress (observed 11–15 minutes end to end, per the
# status history in docs/DEPLOYMENT.md §2a) — no matter what the new commit
# touches. A docs-only or web-only merge is NOT safe during that window; it
# is precisely the thing that killed #405's deploy.
#
# THE CONCURRENCY REASONING BELOW STANDS ON ITS OWN regardless of the
# above correction: a main commit with no successful CI suite is a real
# problem on its own terms — at minimum it is one of this repo's required
# status checks for merging to main — independent of whatever Railway does
# or does not key off it. cancel-in-progress alone is not enough to protect
# that: GitHub's own docs on `concurrency` state "When a concurrent job or
# workflow is queued, if another job or workflow using the same concurrency
# group in the repository is in progress, the queued job or workflow will be
# pending. Any previously pending job or workflow in the concurrency group
# will be canceled" — that PENDING-run cancellation happens unconditionally,
# regardless of cancel-in-progress (which only controls whether the RUNNING
# one is also killed). With a single ci-refs/heads/main group shared by every
# main commit, a three-push burst (A, B, C in quick succession) would still
# lose B's suite even with cancel-in-progress:false for main: A runs, B goes
# pending behind it, C arrives and cancels PENDING-never-run B — same
# "no successful suite" outcome, reached by a different path. So the group
# itself must be per-commit on main, not just per-ref: github.sha is the
# full 40-char commit SHA, guaranteeing every main commit gets its own group
# and is therefore NEVER second-in-group, so neither in-progress nor pending
# cancellation can ever reach it on main. cancel-in-progress stays false for
# main as belt-and-braces (it would never fire given the group is already
# unique per commit) and PR runs are unaffected — they still group per-ref
# with cancellation on, so the de-dup behaviour that was never the problem
# keeps working exactly as before.
#
# ACCEPTED CONSEQUENCE, do not "simplify" this back to a plain ref-based
# group: two main merges close together now run two full suites IN PARALLEL
# instead of de-duplicating to one. That is deliberate — it is CI minutes
# spent buying each main commit its own successful suite. Confirmed twice in
# run history that the old single-group behaviour cost real suites: 6c1ea8f's
# suite (run 38509705510, started 04:06:40Z) was cancelled by the next main
# push's run (38510706826, started 04:18:25Z, 11m45s later); eb186633's suite
# (run 38281282884, 2026-10-12) was cancelled the same way. (This is about the
# CI suite being lost, not about the deploy mechanism corrected above — the
# two are adjacent facts, not cause and effect; see docs/DEPLOYMENT.md §2a.)
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Deterministic, non-secret values used only for CI builds/tests.
  NODE_ENV: test
  CI: 'true'

jobs:
  build-and-test:
    name: Build, typecheck & unit tests
    runs-on: ubuntu-latest
    env:
      # Prisma resolves env("DATABASE_URL")/env("DIRECT_URL") during `validate`
      # and `generate`. These dummy URLs are never connected to — they only
      # satisfy schema env resolution in this DB-less job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # apps/admin/next.config.mjs reads ADMIN_PUBLIC_API_URL while building its
      # rewrites config, and throws if it is unset (BMPL-224) rather than
      # defaulting to the production API — so "Build admin" below cannot even
      # start without it, not just fail a runtime check. This dummy is never
      # connected to (nothing in this job makes a network call), same as the
      # DATABASE_URL/DIRECT_URL dummies above.
      #
      # apps/web/next.config.mjs and apps/web/lib/server-api.ts do the same
      # (BMPL-227) — "Build web" below equally cannot start without this.
      ADMIN_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check (informational)
        run: pnpm format:check
        continue-on-error: true

      - name: Lint (informational until ESLint is configured)
        run: pnpm lint
        continue-on-error: true

      - name: Prisma validate
        run: pnpm --filter @bmpl/database exec prisma validate

      - name: Prisma generate
        run: pnpm --filter @bmpl/database generate

      - name: Build shared packages
        run: pnpm -r --filter "./packages/*" build

      - name: Typecheck (all)
        run: pnpm turbo run typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build API
        run: pnpm --filter @bmpl/api build

      # BMPL-325: a variable genuinely configured on Vercel but never declared
      # in turbo.json is invisible to the Vercel build (turbo's own strict env
      # mode filters it out before the app ever sees it) — the exact shape
      # that left ADMIN_PUBLIC_API_URL unset for 63 days and broke every
      # admin build for 90 commits (BMPL-224/BMPL-323), with nothing here
      # catching it because "Build admin"/"Build web" below run the app's own
      # `build` script directly, bypassing turbo (and its env filtering)
      # entirely. `eslint-plugin-turbo`'s `no-undeclared-env-vars` rule
      # statically finds every `process.env.X` read in apps/admin and
      # apps/web and checks it against turbo.json, so this catches the class
      # of bug before a build ever runs, on every PR, without needing Vercel
      # account access (which GitHub Actions has no route to; see
      # eslint.turbo-env-vars.config.mjs for the two known exceptions and why
      # each is real, not guessed). It does not, and cannot, catch a variable
      # with a fallback that degrades quietly instead of throwing — no static
      # check can fail on a value that's merely wrong, only on one that's
      # provably undeclared.
      - name: Undeclared env vars in apps/admin and apps/web (BMPL-325)
        run: pnpm run lint:turbo-env-vars

      - name: Build web
        run: pnpm --filter @bmpl/web build

      - name: Install Playwright's Chromium
        run: pnpm --filter @bmpl/web exec playwright install --with-deps chromium

      # INFORMATIONAL ON PURPOSE, same mechanism as Format check/Lint above:
      # `continue-on-error: true` at the STEP level means a red result here
      # cannot fail this job, and therefore cannot fail this job's check run
      # — which matters because "Build, typecheck & unit tests" (this job) is
      # one of this repo's required status checks for merging to main
      # (gh api .../branches/main/protection), so a red result here would
      # block every open PR on pure browser-test flakiness regardless of
      # whether it has anything to do with the change under review. A flaky
      # browser suite is a classic source of exactly that kind of unrelated
      # block (BMPL-217/BMPL-213).
      #
      # CORRECTION: this comment used to justify the above by claiming
      # "Railway's GitHub integration waits for check suites before
      # deploying the API." That claim is unevidenced and likely wrong —
      # see the concurrency comment above and docs/DEPLOYMENT.md §2a: a
      # production deployment has been observed starting TWO SECONDS after
      # a push, before any check suite here could possibly have concluded.
      # Whether this suite's result affects the deploy at all is
      # UNESTABLISHED. The required-status-check reason above stands on its
      # own regardless and needs no deploy-gate claim to justify keeping
      # this step informational.
      #
      # Needs no infrastructure of its own (no services: block) — apps/web
      # never talks to Postgres/Redis/MinIO directly (root CLAUDE.md §2),
      # confirmed by this same job already building @bmpl/web above with
      # none running. `retries` is deliberately left at the config default
      # of 0, not raised for CI: a flake here cannot be retried past to
      # protect a gate we have no evidence this step gates, and retrying
      # until green would hide a real intermittent defect behind a false
      # green — exactly the failure shape this floor spent 2026-09-26
      # finding five separate instances of.
      - name: Browser tests (BMPL-217, informational)
        id: e2e
        continue-on-error: true
        run: pnpm --filter @bmpl/web test:e2e

      - name: Upload Playwright report (only when it failed)
        if: steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

      - name: Build admin
        run: pnpm --filter @bmpl/admin build

      - name: Install Playwright's Chromium (admin)
        run: pnpm --filter @bmpl/admin exec playwright install --with-deps chromium

      # Same shape and same reasoning as "Browser tests" above for
      # @bmpl/web: informational via continue-on-error, no services: block
      # (apps/admin never talks to Postgres/Redis/MinIO directly either),
      # no UAT_OPS_PASSWORD set here on purpose -- every test in this suite
      # (apps/admin/e2e/page-header-overflow.spec.ts) calls test.skip() on
      # its own when it's absent, so this step turns silence (CI never
      # invoking the suite at all) into a labelled skip instead, which is
      # the only change in scope.
      - name: Browser tests (admin, informational)
        id: e2e-admin
        continue-on-error: true
        run: pnpm --filter @bmpl/admin test:e2e

      - name: Upload Playwright report (admin, only when it failed)
        if: steps.e2e-admin.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-admin
          path: apps/admin/test-results
          retention-days: 7

      - name: Typecheck mobile
        run: pnpm --filter @bmpl/mobile exec tsc --noEmit

  integration:
    name: Integration tests (Postgres + Redis + MinIO)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bmpl
          POSTGRES_PASSWORD: bmpl_ci_password
          POSTGRES_DB: bmpl_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bmpl -d bmpl_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Storage integration coverage is NOT omitted: MinIO cannot run as a GitHub
      # `services:` entry (it needs a `server /data` command that services can't
      # set), so it is started as a background container step below.
      TEST_DATABASE_URL: postgresql://bmpl:bmpl_ci_password@localhost:5432/bmpl_test?schema=public
      DATABASE_URL: postgresql://bmpl:bmpl_ci_password@localhost:5432/bmpl_test?schema=public
      DIRECT_URL: postgresql://bmpl:bmpl_ci_password@localhost:5432/bmpl_test?schema=public
      REDIS_URL: redis://localhost:6379
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: bmpl
      STORAGE_SECRET_ACCESS_KEY: bmpl_ci_password
      STORAGE_BUCKET: bmpl-documents
      STORAGE_PUBLIC_BUCKET: bmpl-public
      STORAGE_FORCE_PATH_STYLE: 'true'
      JWT_ACCESS_SECRET: ci-access-secret-value-000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-value-00000000000
      COOKIE_SECRET: ci-cookie-secret-value-0000000000000
    steps:
      - uses: actions/checkout@v4

      # quay.io/minio/minio and docker.io/minio/minio were both discontinued/
      # privatized by MinIO Inc. around 2026-09-24 — every client, including a
      # fresh runner, now gets a zero-scope anonymous token from quay.io for
      # this repository. BMPL-188 mirrored the exact, content-identical image
      # into this repo's own GHCR namespace (see
      # .github/workflows/mirror-minio.yml for how, and how that was proven —
      # the manifest digest differs from the original quay.io digest because
      # `docker save`/`load` re-serialises the manifest, but the image config
      # digest and every layer diffID, in order, were confirmed identical).
      # Pinned by GHCR's own digest, which is immutable and cannot be re-tagged.
      - name: Log in to GHCR (pull our own MinIO mirror)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=bmpl -e MINIO_ROOT_PASSWORD=bmpl_ci_password \
            ghcr.io/louve-rg/minio-mirror@sha256:52dfd5c0bbd38d3219f2058c7af216d9f9a27a994b7b5baad09bbd38866015ff server /data
          # Wait until MinIO answers (the API auto-creates its buckets on boot).
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/ready >/dev/null; then echo "minio ready"; break; fi
            sleep 1
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages (needed by the API)
        run: pnpm -r --filter "./packages/*" build

      - name: Integration tests (fails loudly without TEST_DATABASE_URL)
        # globalSetup runs `prisma migrate deploy` against TEST_DATABASE_URL.
        run: pnpm --filter @bmpl/api test:integration

  visual-regression:
    # Priority 6 remediation (owner directive, 2026-10-16): a pixel-baseline
    # visual-regression suite, which needs a live API + seeded database in
    # CI for the first time — the exact "expensive new authenticated CI
    # infrastructure" the owner's directive explicitly, and newly,
    # authorizes (superseding the prior "local-only authenticated browser
    # tests" ruling, god 2026-10-10 — see hive/agents/jim-mv09alb5/
    # priority6-visual-baseline-approach-2026-10-16.md for the full design
    # this job implements, and docs/visual-baseline-exit-log.md for the
    # written, falsifiable criterion that has to be satisfied before this
    # job's own `continue-on-error` comes off).
    #
    # VALIDATED END TO END IN A REAL CI RUN: 38948367691, headSha 981706f,
    # 2026-10-16 — all five jobs green, this job's own seed/API/Playwright
    # chain included (seed base role fixtures -> build+start the API ->
    # readiness gate -> seed UAT logistics against the live API -> Playwright
    # for both web and admin). Three earlier draft-PR runs went red first, on
    # three distinct real causes (a step-ordering bug, then a pre-existing
    # gap in seed-uat-logistics.ts's own email-verification handling, then a
    # call-site placement bug in the fix for that gap) — none of them a
    # missing env var. The question this draft existed to answer is
    # answered: the env block below is complete as written.
    #
    # Phase 1 ships exactly ONE spec (apps/web/e2e/visual/smoke.spec.ts) and
    # it is deliberately not a baseline -- no toHaveScreenshot, no committed
    # PNG. It exists only to prove the chain below actually works end to
    # end (seed -> live API -> dev server on 3177 under Linux -> browser ->
    # login), per god's 2026-10-16 review: a validated run that only proves
    # "the steps executed" is not validated at all. apps/admin's e2e/visual
    # is still empty (Phase 2 adds specs there) -- its own step below is
    # EXPECTED to exit non-zero during Phase 1 for a harmless reason
    # (Playwright exits non-zero on "no tests found"), absorbed by
    # continue-on-error same as always; that is not a finding either.
    name: Visual regression baseline (Priority 6)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bmpl
          POSTGRES_PASSWORD: bmpl_ci_password
          # DELIBERATE, DO NOT "TIDY" THIS TO SOMETHING MORE DESCRIPTIVE LIKE
          # bmpl_visual (which is what this was originally named, until a real
          # CI run refused to seed). It must be exactly "bmpl":
          # prisma/seed-uat-logistics.ts's own assertDevelopmentEnvironment()
          # hard-refuses any database name other than "bmpl" or "bmpl_test"
          # (the latter reserved for the Integration job above) -- see that
          # function for the actual check. This name clears that dev-only
          # assertion on purpose; it is harmless here because this Postgres
          # container is a throwaway on its own isolated runner VM for this
          # one job, destroyed at the end of it -- never the same "bmpl" any
          # human's local dev database, or the Integration job's bmpl_test,
          # refers to. If you want this to read less alarmingly, propose an
          # explicit opt-in flag on the guard itself -- that touches a safety
          # assertion, so it needs its own review, not a drive-by rename here.
          POSTGRES_DB: bmpl
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bmpl -d bmpl"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Same services shape as the Integration job above, duplicated rather
      # than shared across jobs (GitHub Actions jobs don't share services) —
      # a separate runner VM per job, so this "bmpl" database never collides
      # with that job's own bmpl_test despite reusing the same in-VM port.
      DATABASE_URL: postgresql://bmpl:bmpl_ci_password@localhost:5432/bmpl?schema=public
      DIRECT_URL: postgresql://bmpl:bmpl_ci_password@localhost:5432/bmpl?schema=public
      REDIS_URL: redis://localhost:6379
      STORAGE_PROVIDER: minio
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY_ID: bmpl
      STORAGE_SECRET_ACCESS_KEY: bmpl_ci_password
      STORAGE_BUCKET: bmpl-documents
      STORAGE_PUBLIC_BUCKET: bmpl-public
      STORAGE_FORCE_PATH_STYLE: 'true'
      JWT_ACCESS_SECRET: ci-access-secret-value-000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-value-00000000000
      COOKIE_SECRET: ci-cookie-secret-value-0000000000000
      API_PORT: '4000'
      NEXT_PUBLIC_API_URL: http://localhost:4000
      ADMIN_PUBLIC_API_URL: http://localhost:4000
      # Deterministic, CI-only, non-secret fixture credentials (root
      # CLAUDE.md §9 — never a real credential) so the suite's seeded role
      # fixtures (apps/web/e2e/support/auth.ts: SUPER_ADMIN, UAT_DRIVER,
      # etc.) are reachable here, unlike the plain e2e job above, which
      # deliberately provisions none of this.
      SEED_SUPER_ADMIN_EMAIL: visual-ci-admin@bzemarketplace.com
      SEED_SUPER_ADMIN_PASSWORD: VisualCiFixtureOnly!000
      UAT_SEED_PASSWORD: VisualCiFixtureOnly!000
      SEED_DEMO_PASSWORD: VisualCiFixtureOnly!000
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (pull our own MinIO mirror)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=bmpl -e MINIO_ROOT_PASSWORD=bmpl_ci_password \
            ghcr.io/louve-rg/minio-mirror@sha256:52dfd5c0bbd38d3219f2058c7af216d9f9a27a994b7b5baad09bbd38866015ff server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/ready >/dev/null; then echo "minio ready"; break; fi
            sleep 1
          done
          # Hard gate (god, 2026-10-16): the loop above falls through silently
          # if MinIO never becomes ready -- same no-exit idiom the Integration
          # job above already uses, defensible to copy, but a copied idiom
          # still needs a floor. Fail loudly here rather than let every step
          # after this one run against a storage backend that never came up.
          curl -sf http://localhost:9000/minio/health/ready >/dev/null || { echo "MinIO never became ready within 30s" >&2; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages (also runs prisma generate -- @bmpl/database's own build script)
        run: pnpm -r --filter "./packages/*" build

      - name: Migrate the visual-suite database
        run: pnpm --filter @bmpl/database exec prisma migrate deploy

      - name: Seed base role fixtures
        run: pnpm --filter @bmpl/database exec tsx prisma/seed.ts

      - name: Build API
        run: pnpm --filter @bmpl/api build

      - name: Start API and wait for real readiness
        id: start-api
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/api/health >/dev/null; then echo "API ready"; break; fi
            sleep 1
          done
          # Hard gate (god, 2026-10-16): the loop above falls through
          # silently if the API never comes up, which would let this step
          # exit 0 and, because both visual steps below are
          # continue-on-error, the WHOLE JOB would report green with no API
          # running at all -- exactly the shape already caught once this
          # same night in tsc's own incremental cache. continue-on-error must
          # absorb test redness, never infrastructure redness.
          curl -sf http://localhost:4000/api/health >/dev/null || {
            echo "API never became ready within 60s -- see the uploaded log for why" >&2
            cat /tmp/api.log >&2
            exit 1
          }

      - name: Upload API boot log (only when the API never became ready)
        if: steps.start-api.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-api-log
          path: /tmp/api.log
          retention-days: 7

      # Must run AFTER the API is live: seed-uat-logistics.ts seeds its
      # fixtures through real HTTP calls to the running API
      # (packages/database/prisma/seed-uat-logistics.ts, API_BASE default
      # http://localhost:4000), not direct DB writes -- confirmed the hard
      # way on 2026-10-16 (run 38943499250) when this ran before "Start API"
      # and failed on the script's own correct "API is not reachable" guard.
      - name: Seed UAT logistics fixtures (needs the live API)
        run: pnpm --filter @bmpl/database exec tsx prisma/seed-uat-logistics.ts

      - name: Install Playwright's Chromium (web)
        run: pnpm --filter @bmpl/web exec playwright install --with-deps chromium

      - name: Visual regression baseline (web)
        id: visual-web
        continue-on-error: true
        run: pnpm --filter @bmpl/web test:visual

      - name: Upload visual diff report (web, only when it failed)
        if: steps.visual-web.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report-web
          path: apps/web/playwright-report
          retention-days: 7

      - name: Install Playwright's Chromium (admin)
        run: pnpm --filter @bmpl/admin exec playwright install --with-deps chromium

      - name: Visual regression baseline (admin)
        id: visual-admin
        continue-on-error: true
        run: pnpm --filter @bmpl/admin test:visual

      - name: Upload visual diff report (admin, only when it failed)
        if: steps.visual-admin.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-report-admin
          path: apps/admin/playwright-report
          retention-days: 7

  repo-drift-checks:
    name: Repo drift checks (docs, notification & permission catalogs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Four read-only, re-runnable checkers (BMPL-211/BMPL-220/BMPL-304),
      # wired here because each is ALREADY GREEN on main today — wiring a
      # check that is currently failing would make main red on every
      # unrelated merge until someone resolves the underlying finding, the
      # same harm BMPL-235 caused for an unrelated reason (BMPL-310/BMPL-312).
      # No `pnpm install` step exists in this job on purpose: all four import
      # nothing but node:fs/node:path/node:url and their own local baseline
      # file — zero npm dependencies, confirmed before wiring this.
      - name: Notification event catalog drift (BMPL-220)
        run: node scripts/detect-notification-event-catalog-drift.mjs

      - name: Permission catalog drift (BMPL-304)
        run: node scripts/detect-permission-catalog-drift.mjs

      - name: Lookup data inventory citation drift (BMPL-211 follow-up)
        run: node scripts/detect-lookup-inventory-citation-drift.mjs

      - name: Notification category count drift (BMPL-211)
        run: node scripts/detect-notification-category-count-drift.mjs

      # scripts/detect-tracked-deletions.mjs is DELIBERATELY NOT WIRED HERE,
      # and must not be added later without re-reading this comment first
      # (BMPL-310/BMPL-312): it checks `git status` across every checkout
      # linked to this repo on the HOST it runs on — every long-lived agent
      # worktree, not just the tree being built. A GitHub Actions runner is a
      # single fresh, ephemeral clone with no visibility into any other
      # checkout, so the question this script answers ("did a DIFFERENT
      # long-lived checkout just lose tracked files?") has no meaning here.
      # Running it in this job would not fail loudly and safely on a real
      # incident; it would silently report the one checkout it can see as
      # clean, every time, while LOOKING like floor-wide coverage from inside
      # a throwaway clone — worse than not running it at all. It belongs
      # after a real merge on a real host instead: see docs/AGENT-WORKFLOW.md
      # §6, which names the 2026-09-28 incident this was written to prevent a
      # repeat of and says exactly when to run it.

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Run the gitleaks binary directly as a filesystem scan of the checked-out
      # tree (tracked files only — no deps installed in this job). This avoids the
      # gitleaks-action git-log "stderr is not empty" flakiness while still
      # failing the build (exit 2) on any real finding.
      - name: Gitleaks (filesystem scan)
        run: |
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gl.tgz
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 2
