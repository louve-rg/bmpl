name: BMPL-188 — mirror pre-lockout MinIO image to GHCR (one-time)

# quay.io/minio/minio and docker.io/minio/minio were both discontinued/
# privatized by MinIO Inc. around 2026-09-24. Every client — including a
# fresh GitHub-hosted runner — now gets a zero-scope anonymous token from
# quay.io for this repository (confirmed empirically: the auth server issues
# a token with "actions":[] even for an anonymous pull), so a workflow that
# tries to pull-then-push in the same job cannot work: the source is not
# reachable from anywhere anymore, not just from this repo's runners.
#
# The only known-good copy left is the byte-identical image this project's
# own docker-compose.yml has always pinned by digest, cached locally on a
# machine that pulled it before the lockout. That copy was `docker save`d,
# checksummed, and staged as a temporary GitHub Release asset
# (bmpl-188-minio-mirror-source) so this workflow — running with the
# repo's own GITHUB_TOKEN, which has package-publish rights — can load it
# and push it into this repo's own GHCR namespace without ever touching the
# now-locked-out registry. This is a one-time migration step, not a
# recurring sync: quay.io is not the source of truth for anything after
# this runs, this repo's GHCR package is.
#
# Provenance of the staged bytes is checked by SHA-256 of the archive itself
# (below). The manifest digest is EXPECTED to differ from the source after
# this round-trip and is not asserted: `docker save`/`docker load` is
# Docker's own archive format, not the registry's, and does not carry the
# original registry manifest JSON — `docker push` builds a brand-new
# manifest from the loaded config+layers, which gets a new digest even when
# every byte of the actual image is unchanged (confirmed empirically on the
# first real run of this workflow: manifest digests differed while the
# image itself did not). A manifest-digest comparison here tests the
# transport, not the image, and would fail forever regardless of content.
#
# What's actually asserted is CONTENT identity, which is stronger, not
# weaker: the image CONFIG DIGEST and the ORDERED LIST OF LAYER diffIDs of
# the freshly loaded original, captured before push, against the same two
# things from a genuinely fresh pull of the pushed package (local tag
# removed first). If the config digest and every layer match in order, the
# filesystem, entrypoint and everything a test can observe are identical —
# the only difference is the manifest wrapper. Either mismatch fails the
# job — it does not warn and continue.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIRROR to run this one-time push'
        required: true

permissions:
  contents: read
  packages: write

env:
  SOURCE_DIGEST: sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  STAGING_RELEASE: bmpl-188-minio-mirror-source
  STAGING_ASSET: minio-mirror.tar.gz
  DEST_IMAGE: ghcr.io/${{ github.repository_owner }}/minio-mirror
  DEST_TAG: RELEASE.2025-09-07T16-13-09Z

jobs:
  mirror:
    if: github.event.inputs.confirm == 'MIRROR'
    name: Mirror to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Download staged image archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$STAGING_RELEASE" \
            --repo "${{ github.repository }}" \
            --pattern "$STAGING_ASSET" --pattern "${STAGING_ASSET}.sha256"

      - name: Verify staged archive checksum
        run: sha256sum -c "${STAGING_ASSET}.sha256"

      - name: Load image
        id: load
        run: |
          gunzip -k "$STAGING_ASSET"
          docker load -i "${STAGING_ASSET%.gz}" | tee load.log
          # `docker save` was done BY DIGEST on the staging machine, so the tar
          # carries no RepoTags — `docker load` restores an untagged image, and
          # RepoDigests is never populated by `load` regardless (that field is
          # only set by an actual registry pull/push round-trip, which is
          # exactly why the meaningful digest check below happens AFTER the
          # push, not here). Tag by the image ID `load` itself reports, not a
          # name that may not exist.
          LOADED_ID=$(grep -oE 'sha256:[0-9a-f]{64}' load.log | head -1)
          test -n "$LOADED_ID" || { echo "::error::could not parse an image id out of docker load's output"; exit 1; }
          LOADED_LAYERS=$(docker image inspect "$LOADED_ID" --format '{{json .RootFS.Layers}}')
          echo "loaded image config digest: $LOADED_ID"
          echo "loaded image layer diffIDs: $LOADED_LAYERS"
          echo "id=$LOADED_ID" >> "$GITHUB_OUTPUT"
          echo "layers=$LOADED_LAYERS" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tag and push mirror
        run: |
          docker tag "${{ steps.load.outputs.id }}" ${DEST_IMAGE}:${DEST_TAG}
          docker push ${DEST_IMAGE}:${DEST_TAG}

      - name: Prove content identity (config digest + ordered layer diffIDs), then pin our own digest
        env:
          ORIGINAL_ID: ${{ steps.load.outputs.id }}
          ORIGINAL_LAYERS: ${{ steps.load.outputs.layers }}
        run: |
          docker rmi ${DEST_IMAGE}:${DEST_TAG} 2>/dev/null || true
          docker pull ${DEST_IMAGE}:${DEST_TAG}
          PULLED_ID=$(docker image inspect ${DEST_IMAGE}:${DEST_TAG} --format '{{.Id}}')
          PULLED_LAYERS=$(docker image inspect ${DEST_IMAGE}:${DEST_TAG} --format '{{json .RootFS.Layers}}')
          PULLED_DIGEST=$(docker image inspect ${DEST_IMAGE}:${DEST_TAG} --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)

          echo "== manifest digest (expected to differ — save/load re-serialises the manifest, not asserted) =="
          echo "source (quay.io):      $SOURCE_DIGEST"
          echo "destination (ghcr.io): $PULLED_DIGEST"

          echo "== image config digest (asserted) =="
          echo "original:    $ORIGINAL_ID"
          echo "ghcr mirror: $PULLED_ID"

          echo "== ordered layer diffIDs (asserted) =="
          echo "original:    $ORIGINAL_LAYERS"
          echo "ghcr mirror: $PULLED_LAYERS"

          test "$PULLED_ID" = "$ORIGINAL_ID" || { echo "::error::config digest differs — this is a real content difference, not a transport artifact. Stop."; exit 1; }
          test "$PULLED_LAYERS" = "$ORIGINAL_LAYERS" || { echo "::error::layer diffIDs differ or are out of order — this is a real content difference, not a transport artifact. Stop."; exit 1; }

          echo "CONTENT IDENTITY PROVEN: identical config and identical ordered layers. The manifest digest differs only because docker save/load re-serialises the manifest — the image itself is unchanged. Pin ghcr.io by $PULLED_DIGEST."

      - name: Report package visibility (informational)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/users/${{ github.repository_owner }}/packages/container/minio-mirror" --jq '{name, visibility, package_type}' || \
          echo "could not query package visibility via API with this token — check manually in the repo's Packages tab"
