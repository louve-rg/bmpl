# `name:` pins the Compose project explicitly (BMPL-297). Without it, Compose
# names the project after the invoking directory, and this repo's multiple
# git worktrees (bmpl-api, bmpl-qa, bmpl-web, ...) each have a DIFFERENT
# directory name — so the SAME `docker compose up`, run from two different
# worktrees, silently created two different sets of named volumes even
# though every `container_name` below is identical. Whichever set happened
# to be attached when a container was last (re)created is "the" data; the
# others sit orphaned on disk. Pinning the project name means every
# worktree's compose invocation always resolves to the SAME volumes, so a
# recreate from any worktree reattaches to the one everyone already depends
# on instead of forking a new one. This already happened once — see
# docs/PROJECT_STATUS.md.
#
# THIS INFRA IS SHARED ON PURPOSE ACROSS EVERY BMPL WORKTREE ON THIS HOST —
# not a coincidence, and not something to "fix" by giving each worktree its
# own isolated containers. Every worktree's `.env` points at the same
# Postgres/Redis/MinIO by design, the same way a team would share one dev
# database: a real admin action or a piece of platform config here is meant
# to be visible to every worktree, not scoped to whichever one made it (see
# CLAUDE.md and docs/PROJECT_STATUS.md). The one place this project
# deliberately does the OPPOSITE is the test database, which is isolated
# PER WORKTREE (`bmpl_test_<worktree>`, not this file — see CLAUDE.md
# "Running the integration suite locally") because concurrent test runs
# truncating one shared database caused false-green results. Both are
# intentional; neither is a bug in the other.
#
# `docker compose down` (or a raw `docker rm`) run from ANY worktree stops
# ALL of this for EVERY worktree at once — whoever else is mid-test sees
# failing tests, not an outage. `pnpm infra:down` runs through
# scripts/infra-down-guard.mjs, which asks for confirmation before doing
# that. `pnpm infra:up` is intentionally NOT gated — it is idempotent and
# is chained into `pnpm setup`, which runs non-interactively.
name: bmpl

services:
  postgres:
    image: postgres:16-alpine
    container_name: bmpl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bmpl
      POSTGRES_PASSWORD: bmpl_dev_password
      POSTGRES_DB: bmpl
    ports:
      - "5432:5432"
    volumes:
      - bmpl_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bmpl -d bmpl"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bmpl-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bmpl_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3-compatible object storage for documents/images in development.
  # Production uses Cloudflare R2 / Amazon S3 / Supabase Storage via the same S3 API.
  #
  # quay.io/minio/minio (and docker.io/minio/minio) were discontinued by
  # MinIO Inc. on 2026-09-24 — the registry now refuses every pull, so this
  # image is pinned to this repo's own GHCR mirror instead (BMPL-188/294).
  # It's the byte-identical image: config digest and every layer diffID
  # match the original, in order (see .github/workflows/mirror-minio.yml for
  # how that was proven; the manifest digest itself differs because a
  # docker-save/load round trip re-serialises the manifest, not the image).
  # The mirror package is public, so this pulls with no login and no token —
  # same as the original always did. Pinned by digest, not a tag: this repo's
  # own package cannot be silently moved or re-tagged out from under you.
  minio:
    image: ghcr.io/louve-rg/minio-mirror@sha256:52dfd5c0bbd38d3219f2058c7af216d9f9a27a994b7b5baad09bbd38866015ff
    container_name: bmpl-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bmpl
      MINIO_ROOT_PASSWORD: bmpl_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bmpl_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bmpl_pg_data:
  bmpl_redis_data:
  bmpl_minio_data:
